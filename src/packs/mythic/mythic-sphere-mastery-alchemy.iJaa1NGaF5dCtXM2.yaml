  description:
    instructions: ""
    unidentified: ""
    value: '<p><strong>Prerequisites:</strong> Alchemy sphere.</p><p>Gain one Alchemy
      talent you don''t already know, plus one of these two options:</p><p><strong>Permanent
      formulae:</strong> You can keep one permanent formulae per tier, designated
      when crafted. They don''t count against your normal crafted-formulae limit and
      never expire, but are still used up when used. As a swift action, spend 1 mythic
      power and make a Craft (alchemy) check to turn one formulae you hold into any
      other formulae you can craft; the check sets the new formulae''s power.</p><p><strong>Compound
      poisons:</strong> When you make an Alchemy sphere poison, spend 1 mythic power
      to make it work in two delivery forms at once (for example, coat a weapon and
      also throw it as an inhaled cloud in the same action). Separately, spend 1 mythic
      power to give the poison two toxins instead of one (the base poison counts as
      a toxin); targets save against each toxin separately.</p><p>You may take this
      mastery a second time to gain the option you didn''t pick.</p><p><em>Source:
      Mythic Spheres.</em> <a href="http://spheresofpower.wikidot.com/mythic-spheres#toc326">Full
      text</a></p>'
