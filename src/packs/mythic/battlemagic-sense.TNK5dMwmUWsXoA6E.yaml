  description:
    instructions: ""
    unidentified: ""
    value: '<p><strong>Prerequisites:</strong> 3rd mythic tier (3rd-tier spheremaster
      path ability).</p><p>Add your mythic tier to Spellcraft checks to identify sphere
      effects (ongoing or being cast), and you can attempt these checks untrained.
      As a swift or immediate action, spend 1 mythic power to use your base attack
      bonus as your Spellcraft ranks for 1 minute.</p><p>You automatically notice
      any sphere effect with a range beyond personal or touch cast within 20 ft. +
      10 ft. per mythic tier, and may try to identify it with Spellcraft (-4 if you
      cannot see the caster or don''t know it is there). When you identify a sphere
      effect whose caster must make a concentration check because of you (casting
      defensively while you threaten, or because you hurt or distracted them), that
      check''s DC rises by your mythic tier.</p><p>After identifying a sphere effect
      as it is cast, if you can counter it (normally via the Counterspell feat) you
      may spend 1 mythic power to counter it as an immediate action, even without
      line of sight to the caster. When you have readied an action to counterspell,
      add your mythic tier to any magic skill check it requires.</p><p><em>Source:
      Mythic Spheres.</em> <a href="http://spheresofpower.wikidot.com/mythic-spheres#toc106">Full
      text</a></p>'
