    unidentified: ""
    value: '<p><strong>Prerequisites:</strong> Berserker sphere.</p><p>You gain one Berserker talent you do not already have.</p><p>While berserking, you may take an extra -4 penalty to AC to gain additional temporary hit points equal to your base attack bonus (at most twice your mythic tier from this ability).</p><p>Add your mythic tier to your base attack bonus when working out a brutal strike''s extra damage (so expending martial focus adds 2 &times; (base attack bonus + tier)).</p><p>When using an (adrenaline) talent, you may instead lower your AC in steps of 2, even if the talent would not normally lower it, for a +1 increase per step to that talent''s bonuses (maximum +5).</p><p><em>Source: Mythic Spheres.</em> <a href="http://spheresofpower.wikidot.com/mythic-spheres#toc334">Full text</a></p>'
