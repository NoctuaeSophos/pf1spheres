  description:
    instructions: ""
    unidentified: ""
    value: '<p>Once per day, as a free action usable even outside your turn, enter
      an empowered state for 3 rounds. While empowered:</p><ul><li>Your abilities
      cost no resources (spell points, mythic power, daily class-feature uses and
      so on), but you still cannot spend more per round than you normally could.</li><li>Your
      hit points cannot drop below 1, and you succeed on every saving throw.</li><li><em>Errata:</em>
      you are immune to negative conditions and have spell resistance that hostile
      effects can never overcome, while effects you want to affect you bypass it automatically.</li></ul><p>When
      it ends you fall unconscious and nothing, mythic abilities included, can wake
      you until you have had 8 hours of rest. Once activated, neither the duration
      nor the unconsciousness can be avoided: you get exactly three rounds'' worth
      of actions (time-altering areas cannot shorten or lengthen this), and the unconsciousness
      cannot be shifted to another body or mind.</p><p><em>Source: Mythic Spheres.</em>
      <a href="http://spheresofpower.wikidot.com/mythic-spheres#toc33">Full text</a></p>'
