    value: '<p><strong>Prerequisites:</strong> Mythic spherecaster or champion.</p><p>Gain
      one bonus magic talent at every odd mythic tier you have, including odd tiers
      reached after taking this ability (one talent per odd tier: 1st, 3rd, 5th, 7th,
      9th).</p><p>This is a universal mythic spherecaster class ability, usable by
      any mythic spherecaster or champion. A mythic class ability counts as a 1st-tier
      universal path ability and can also be taken in place of a mythic feat; it can
      be taken only once. You cannot have both this and Mythic Combat Talents.</p><p><em>Source:
      Mythic Spheres.</em> <a href="http://spheresofpower.wikidot.com/mythic-spheres#toc414">Full
      text</a></p>'
