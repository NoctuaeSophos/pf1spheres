    value: '<p><strong>Prerequisites:</strong> Mythic spherecaster or champion.</p><p>Pick
      two spheres. You gain a +1 mythic bonus to caster level for those spheres, rising
      by +1 at 3rd tier and every odd tier after (+1 at 1st-2nd, +2 at 3rd-4th, +3
      at 5th-6th, +4 at 7th-8th, +5 at 9th-10th). Determine its effects as you would
      an implement''s caster level bonus; it stacks with implement bonuses.</p><p>This
      is a universal mythic spherecaster class ability, usable by any mythic spherecaster
      or champion. A mythic class ability counts as a 1st-tier universal path ability
      and can also be taken in place of a mythic feat; it can be taken only once.</p><p><em>Source:
      Mythic Spheres.</em> <a href="http://spheresofpower.wikidot.com/mythic-spheres#toc412">Full
      text</a></p>'
