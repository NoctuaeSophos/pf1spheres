    value: '<p><strong>Prerequisites:</strong> Nature sphere.</p><p>Choose one of
      these benefits:</p><ul><li><strong>Package swap:</strong> As a swift action,
      spend 1 mythic power to trade one Nature package you know for one you lack,
      for 1 minute per mythic tier. Talents that require the swapped-out package as
      a prerequisite may be swapped along with it.</li><li><strong>Package breadth:</strong>
      As a swift action, spend 1 mythic power to gain, for 1 minute per mythic tier,
      every talent option (spirit talents included) whose prerequisite is a Nature
      package you have. Options belonging to packages you lack are not included.</li></ul><p>You
      can take this mastery a second time to gain the benefit you did not pick the
      first time.</p><p><em>Source: Mythic Spheres.</em> <a href="http://spheresofpower.wikidot.com/mythic-spheres#toc367">Full
      text</a></p>'
