      save against an effect that still affects you on a success, you may spend 1
      mythic power to succeed on that save instead.</p><p>A mythic class feature counts
      as a 1st-tier universal path ability and can also be taken in place of a mythic
      feat. It can be taken only once unless stated otherwise.</p><p><em>Source: Mythic
      Spheres.</em> <a href="http://spheresofpower.wikidot.com/mythic-spheres#toc736">Full
