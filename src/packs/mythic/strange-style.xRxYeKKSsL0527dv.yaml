    unidentified: ""
    value: '<p><strong>Gifted, 1st tier (Ex).</strong> You gain proficiency in a number of exotic weapons equal to your mythic tier. After practicing with an exotic weapon for 1 hour, you wield it for 24 hours as if it had one of these special features: blocking, brace, deadly, disarm, distracting, monk, nonlethal, performance or trip; or as if it lacked the fragile or nonlethal feature.</p><p>Spend 1 mythic power to practice as a full-round action instead of for an hour.</p><p>Practice for 1 hour and spend 1 mythic power to add the grapple or reach feature instead, or to add or remove a number of the features above equal to half your mythic tier (minimum 1).</p><p><em>Source: Mythic Spheres.</em> <a href="http://spheresofpower.wikidot.com/mythic-spheres#toc150">Full text</a></p>'
