  description:
    instructions: ""
    unidentified: ""
    value: '<p><strong>Gifted, 3rd tier.</strong> When an adjacent ally gains one
      of these conditions, spend 1 mythic power as a free action to have it affect
      you instead: bleed, blinded, confused, cowering, cursed, dazed, dazzled, deafened,
      diseased, entangled, exhausted, fascinated, fatigued, frightened, nauseated,
      panicked, paralyzed, poisoned, shaken, sickened, staggered, stunned, or any
      pain effect. Spending 2 mythic power extends this to an ally within 30 feet.</p><p><strong>Shaking
      it off:</strong> If the transferred effect has a duration and allows a save,
      at the end of each of your turns you may spend 1 mythic power (2 if the effect
      is mythic) for a new save to end it, no action required. If it is instantaneous,
      permanent or allows no save, you can end it after 1 minute by spending 2 mythic
      power (4 if mythic).</p><p><em>Source: Mythic Spheres.</em> <a href="http://spheresofpower.wikidot.com/mythic-spheres#toc166">Full
      text</a></p>'
