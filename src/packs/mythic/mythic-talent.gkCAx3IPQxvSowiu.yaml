    instructions: ""
    unidentified: ""
    value: '<p>Pick a single known talent, or a set of known talents that combine
      into one effect, as your mythic talent. Three times per day you can cast it
      without paying spell points, whatever it would normally cost; its casting time
      doesn''t change.</p><p>You may also add metamagic feats you know to it without
      spending spell points or lengthening the casting time, as long as their combined
      spell point cost or level increase is no more than half your tier (rounded down,
      minimum 1).</p><p>Example group: one (blast type), one (blast shape) and the
      extra-damage spell point option of a destructive blast. You still can''t combine
      talents you couldn''t normally combine. Spellcrafted powers can''t be chosen.</p><p><em>Source:
      Mythic Spheres.</em> <a href="http://spheresofpower.wikidot.com/mythic-spheres">Full
      text</a></p>'
