    instructions: ''
    unidentified: ''
    value: '<p>Once per day, as an immediate action, activate for 3 rounds: add your
      tier to AC, MSD, CMD and all saves, and gain a 50% + 5% per tier miss chance
      against all effects, including ones that don''t target you. This miss chance
      doesn''t stack with other miss chances (use the highest).</p><p>When it ends,
      take a penalty of twice your tier to AC, MSB, CMD and saves until you complete
      8 hours of rest; nothing else removes it, including effects that shorten rest
      or reverse time. You can activate at a lower tier than your actual tier to shrink
      both the bonus and the penalty.</p><p><em>Source: Mythic Spheres.</em> <a href="http://spheresofpower.wikidot.com/mythic-spheres#toc25">Full
      text</a></p>'
