  description:
    instructions: ""
    unidentified: ""
    value: '<p><strong>Prerequisites:</strong> Protection sphere.</p><p>Choose one
      of the following options:</p><p><strong>Instant defense:</strong> As an immediate
      action, spend 1 mythic power to put up one of your known wards or aegises on
      a legal target, applying any talents you could normally add (such as Mass Aegis).
      This can be done before a declared action resolves, e.g. in response to a breath
      weapon.</p><p><strong>Ward control:</strong> When one of your wards would stop
      a non-ally from acting (blocked by Impedance, teleport prevented by Quantum
      Lock, spell stopped by Spell Ward, and so on), you may let the action happen
      instead. If you do, spend 1 mythic power as an immediate action to make that
      action''s choices yourself (where it teleports, whom the spell targets, how
      it moves).</p><p><strong>Fortifying aegis:</strong> Creatures under your aegis
      have a 50% chance to negate critical hits and sneak attacks (treated as normal
      hits), like medium fortification. Spend 1 mythic power when casting the aegis
      to raise this to 100% for 10 minutes per tier.</p><p>You may take this mastery
      multiple times, choosing a new option each time.</p><p><em>Source: Mythic Spheres.</em>
      <a href="http://spheresofpower.wikidot.com/mythic-spheres#toc371">Full text</a></p>'
