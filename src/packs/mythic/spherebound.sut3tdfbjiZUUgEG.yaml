  description:
    instructions: ""
    unidentified: ""
    value: '<p>Choose one: +2 inherent bonus to caster level in one magic sphere and
      -1 in your other magic spheres; +2 to effective BAB or ranks for one combat
      sphere and -1 for your other combat spheres; or +2 effective ranks in all skills
      for one skill sphere and -1 for your other skill spheres. The penalty can''t
      lower a value below 1, and you need at least two spheres of that system. You
      may take it up to three times, each for a different system; the bonus applies
      to talent effects, not skill rolls.</p><p>The changes are set for a magic sphere:
      set the +3 change''s target to your chosen sphere (Death by default), which
      nets +2 there after the -1 to all caster levels.</p><p><em>Source: Mythic Spheres
      of Power.</em> <a href="http://spheresofpower.wikidot.com/mythic-spheres">Full
      text</a></p>'
