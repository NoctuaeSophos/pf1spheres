  description:
    instructions: ""
    unidentified: ""
    value: '<p>A mythic tradition describes how a character gained mythic power. It
      is built from drawbacks (real penalties), qualities (mixed benefit and cost)
      and boons (bought with drawbacks). The GM has final say, traditions are normally
      fixed at ascension, and they can change later at GM discretion.</p><p>Each option
      can be taken once unless it says otherwise. Effects that raise effective tier
      (such as Mythic Paragon) don''t affect tradition options unless an option says
      so.</p><p><strong>Drawbacks:</strong> Each drawback, up to three, grants either
      +1 use of mythic power per day or one boon. Drawbacks should actually hinder
      the character regularly; one that never comes up shouldn''t earn a benefit.
      The GM may require certain drawbacks.</p><p><strong>Variant drawbacks:</strong>
      Harsher versions meant only for session-based games with long downtime between
      sessions; the GM chooses whether the regular or variant version is used.</p><p><strong>Qualities:</strong>
      Normally at most one per character (more with GM permission). A tradition may
      consist of just one quality.</p><p><strong>Boons:</strong> No creature may have
      more than three boons.</p><p><em>Source: Mythic Spheres.</em> <a href="http://spheresofpower.wikidot.com/mythic-spheres#toc0">Full
      text</a></p>'
