  description:
    instructions: ""
    unidentified: ""
    value: '<p><strong>Prerequisites:</strong> Time sphere.</p><p>As an immediate
      action, spend 1 mythic power to use any (time) talent you know, applying any
      talents you could normally add to it. This can be done before a declared action
      resolves, e.g. activating After Image when an enemy attacks you.</p><p>When
      you use alter time, you may spend 1 mythic power: creatures you Slow lose their
      Dexterity bonus to AC for as long as they stay slowed, and creatures you Haste
      gain an extra move action each round.</p><p><em>Source: Mythic Spheres.</em>
      <a href="http://spheresofpower.wikidot.com/mythic-spheres#toc382">Full text</a></p>'
