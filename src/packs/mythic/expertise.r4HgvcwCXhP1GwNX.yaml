  description:
    instructions: ''
    unidentified: ''
    value: '<p>Gain one class feature from a class or prestige class you don''t have
      (archetype features count), using your total character level as the class level.
      For prestige class features, subtract the class''s minimum entry level (usually
      5) first. You must meet the feature''s other prerequisites and its level requirement
      (you can take the boon early and gain the feature on reaching that level). If
      the feature keys off an ability score, you may use your highest mental ability
      modifier instead.</p><p>It cannot grant casting or talent progression (talents,
      spell slots, spell points), though features that modify casting or grant specific
      spell-like abilities are allowed. If the feature picks from a list of options
      (e.g. mystic combats, bonus feats), you get only one choice; fixed level-gated
      parts of a feature are gained in full. Features that grant all of another class''s
      features (such as the evangelist''s Aligned Class) don''t work.</p><p>Each time
      you gain a tier, or if you would gain the chosen feature normally, you may retrain
      it to a different feature. The GM must approve the choice and may pick it for
      you.</p><p><em>Source: Mythic Spheres.</em> <a href="http://spheresofpower.wikidot.com/mythic-spheres#toc36">Full
      text</a></p>'
