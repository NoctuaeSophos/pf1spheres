  description:
    instructions: ""
    unidentified: ""
    value: "<p><strong>Craft DC:</strong> 20</p>

      <p>You create a neutralizing paste that can be applied to yourself or a willing creature within
      your reach as a standard action.</p>

      <p>Neutralizers aid against one energy type of your choice (acid, cold, electricity, or fire), chosen
      at the time of creation, plus an additional damage type at 10 ranks in Craft (alchemy), and grants
      energy resistance 5 against the chosen damage type, plus 5 additional points of energy resistance
      per 5 ranks in Craft (alchemy) you possess. Neutralizers lose their effectiveness after suffering
      two attacks of the chosen energy type, or after 10 minutes, whichever comes first. A creature can
      only benefit from one neutralizer at a time, applying another neutralizer replaces the effects of
      the previous one.</p>

      <p>You can increase the Craft DC for this formulae in increments of 10; each time you do you may
      suffer one additional attack, and increase the duration of the neutralizer before it becomes ineffective
      by an additional 10 minutes.</p>

      "
