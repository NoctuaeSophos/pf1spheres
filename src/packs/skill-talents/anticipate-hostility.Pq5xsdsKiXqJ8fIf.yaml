  description:
    instructions: ""
    unidentified: ""
    value: '<p>Subject must be a creature. You gain an insight bonus to AC against
      its attacks equal to 2 + 1 per 10 ranks in the associated skill.</p><p><strong>Notions:</strong>
      the subject misses another creature by 5 or more; hits another creature''s AC
      by 5 or more; confirms a critical hit; or makes an attack of opportunity against
      another creature.</p><p><strong>Breakthrough:</strong> As an immediate action,
      spend any number of notions to increase the AC bonus by 1, plus 1 per 2 notions
      beyond the first (rounded down, minimum 1), until the start of your next turn.</p><p><strong>Breakthrough:</strong>
      When the subject attacks you, spend 2 notions as an immediate action (or 3 as
      a free action usable off-turn) to shift position; if the attack misses you,
      it is rerolled against an adjacent creature or object of your choice at a -2
      penalty.</p><p><em>Source: Spheres of Guile.</em> <a href="http://spheresofpower.wikidot.com/study#toc26">Full
      text</a></p>'
