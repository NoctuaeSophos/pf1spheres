  description:
    instructions: ""
    unidentified: ""
    value: '<p>You can keep up to twice your operative ability modifier (minimum 2)
      flawless memories at once. Memorizing takes a swift action each round while
      you perceive the material. One memory holds up to 20 pages of text, 30 minutes
      of sound, or 1 minute of full sensory experience.</p><p>You can make checks
      against a stored memory as if you were there (no retrying the same check), but
      fine detail is lost beyond 30 ft. of where you stood. Recalling one lets you
      spot new details with Perception or similar skills, and each memory grants 1
      temporary skill leverage usable only within it. You cannot use senses you lacked
      at the time. Dismissing a memory is a free action.</p><p>Remembered magical
      effects carry no magic: you cannot cast from a remembered scroll, and reliving
      a harmful effect does not affect you.</p><p><em>Source: Spheres of Guile.</em>
      <a href="http://spheresofpower.wikidot.com/study#toc12">Full text</a></p>'
