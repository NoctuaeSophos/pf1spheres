  description:
    instructions: ''
    unidentified: ''
    value: '<p><strong>Prerequisites:</strong> Associated skill 7 ranks, Study sphere.</p><p>Subject
      must be a creature. As a standard action, aim a torrent of near-nonsense at
      the subject, which must be able to hear you; it must make a Will save or be
      confused or dumbfounded (your choice) until the end of its next turn. This is
      a supernatural, mind-affecting, language-dependent disorientation effect.</p><p><strong>Notions:</strong>
      a creature succeeds on a Cha-, Int-, or Wis-based skill check against the subject;
      the subject fails a Will save; the subject uses Linguistics to find a loophole
      in an effect.</p><p><strong>Breakthrough:</strong> Spend 2 notions to make the
      base ability''s condition last a number of rounds equal to your operative modifier
      (minimum 1).</p><p><strong>Breakthrough:</strong> When using the base ability,
      spend 2 notions to also deal 1d8 nonlethal damage + 1d8 per 3 ranks in the associated
      skill (half on a successful save). Spend 2 more notions to also deal 1 point
      of Cha, Int, or Wis damage (your choice) per die rolled (Will halves).</p><p><em>Source:
      Spheres of Guile.</em> <a href="http://spheresofpower.wikidot.com/study#toc39">Full
      text</a></p>'
