  description:
    instructions: ""
    unidentified: ""
    value: '<p>Subject must be a creature. You are not flat-footed when it surprises
      you, and you keep your Dex bonus to AC against it when it is invisible or you
      are otherwise unaware of it (you still lose it if immobilized or successfully
      feinted by it). Any miss chance the subject has is reduced by 5% per notion
      on this theory.</p><p><strong>Notions:</strong> the subject damages a creature
      that cannot perceive it or is denied its Dex bonus to AC; another creature pinpoints
      or reveals the subject while it has total concealment; the subject attacks with
      a positional advantage (higher ground, flanking, etc.) or is attacked by a creature
      that has one; another creature misses the subject because of miss chance.</p><p><strong>Breakthrough:</strong>
      When you miss because of concealment, spend 1 notion as a free action, even
      off-turn, to reroll the miss chance.</p><p><strong>Breakthrough:</strong> As
      a swift action, spend any number of notions to gain blindsense 30 ft. that works
      only against the subject, lasting 1 round per notion.</p><p><strong>Breakthrough:</strong>
      As a swift action, spend any number of notions to gain a +3 insight bonus on
      opposed Perception checks for 1 round per notion, +1 per 4 ranks in the associated
      skill.</p><p><strong>Associated feat:</strong> Blind-Fight.</p><p><em>Source:
      Spheres of Guile.</em> <a href="http://spheresofpower.wikidot.com/study#toc30">Full
      text</a></p>'
