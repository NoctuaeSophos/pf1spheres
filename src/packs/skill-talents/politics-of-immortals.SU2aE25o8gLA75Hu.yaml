    unidentified: ""
    value: '<p><strong>Prerequisites:</strong> Study sphere (Speculate Affairs).</p><p>When
      your Speculate Affairs research topic is a group that includes otherworldly
      beings (outsiders, fey, gods, and the like), it gains these extras. With 3+
      notions, entering a new location tells you the group''s decrees, pacts, or taboos
      about that area. Learning a creature''s strength tier also reveals its alignment,
      type, subtypes, and planar ties. Learning of groups that regard the topic highly
      or poorly lets you name the planes they come from (if such groups exist there)
      or learn which planes they are tied to.</p><p><strong>Breakthrough:</strong>
      When negotiating with a creature under a (calling) effect (such as planar binding
      or Call Planar Creature), spend any number of notions; each either treats it
      as 1 HD lower for its payment or grants +1 on your Charisma check to persuade
      it. If you are the one bound by such an effect, each notion instead grants +1
      on Charisma checks to escape.</p><p><strong>Breakthrough:</strong> When researching
      or speaking an outsider''s true name, or researching an infernal contract or
      similar document, spend any number of notions for +1 per notion on the Knowledge
      (planes) or Linguistics check.</p><p><em>Source: Baron''s Uncanny Gateway.</em>
      <a href="http://spheresofpower.wikidot.com/study#toc45">Full text</a></p>'
