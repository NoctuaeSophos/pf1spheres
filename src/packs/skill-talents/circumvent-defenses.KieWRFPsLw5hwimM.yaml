  description:
    instructions: ""
    unidentified: ""
    value: '<p>Subject must be a creature. As a swift action, until the start of your
      next turn your attacks against it bypass 2 points of damage reduction or 5 points
      of energy resistance; if it has no DR (or your attack already bypasses it),
      your attacks deal +1d4 precision damage instead. Per 5 ranks in the associated
      skill, bypass 1 more point of DR or 2 more of energy resistance and raise the
      precision die one step (to 1d12 at 20 ranks).</p><p><strong>Notions:</strong>
      another creature overcomes the subject''s DR or regeneration by its normal means
      (not a general DR-bypassing ability); the subject is affected by something that
      lowers its AC; a creature hits the subject''s AC by 5 or more; another creature
      uses a damage type or effect the subject is weak to.</p><p><strong>Breakthrough:</strong>
      When using the base ability, spend any number of notions; each bypasses 2 more
      DR or 5 more energy resistance, or adds +1 precision damage against a subject
      without DR.</p><p><strong>Breakthrough:</strong> Spend 2 notions to use the
      base ability as a free action instead of a swift action.</p><p><strong>Breakthrough:</strong>
      Spend 3 notions while using the base ability against a subject that has suppressible
      fast healing or regeneration, or vulnerability to a damage type. For rounds
      equal to your operative ability modifier (minimum 1), half your weapon damage
      (rounded down) counts as an energy type it is vulnerable to or that suppresses
      its fast healing or regeneration.</p><p><strong>Associated feat:</strong> Penetrating
      Strike.</p><p><em>Source: Spheres of Guile.</em> <a href="http://spheresofpower.wikidot.com/study#toc29">Full
      text</a></p>'
