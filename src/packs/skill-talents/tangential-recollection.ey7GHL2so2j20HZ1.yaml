  description:
    instructions: ''
    unidentified: ''
    value: '<p>When you fail a Knowledge, Lore, or similar check to recall information,
      you can spend 1 skill leverage to try a recall check with a different skill.
      On a success you count as having passed the original check by the minimum, but
      the information is slanted toward the new skill (for example, identifying a
      plant creature with Knowledge (arcana) instead reveals its spell resistance
      and magical traits). You must have skill leverage unlocked with one of the two
      skills. If the substitute skill is implausible, the GM may raise the DC or rule
      an automatic failure.</p><p><em>Source: Spheres of Guile.</em> <a href="http://spheresofpower.wikidot.com/study#toc17">Full
      text</a></p>'
