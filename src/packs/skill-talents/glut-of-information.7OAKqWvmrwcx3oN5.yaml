    instructions: ''
    unidentified: ''
    value: '<p>Apply to a plan that reveals information. If the plan already calls
      for a check to learn or access the information, its DC increases by 5; otherwise
      you must make a suitable Knowledge or Lore check, DC 20 + the CR of the most
      dangerous relevant creature or hazard. Either way you learn two extra pieces
      of information of the same kind. On a success one of them is irrelevant or slightly
      misleading; on a failure you still get the original information but both extras
      are false or badly misleading.</p><p><em>Source: Spheres of Guile.</em> <a href="http://spheresofpower.wikidot.com/study#toc23">Full
