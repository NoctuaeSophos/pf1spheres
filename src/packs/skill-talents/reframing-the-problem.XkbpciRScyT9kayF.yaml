    instructions: ""
    unidentified: ""
    value: '<p>Apply to a plan talent that produces an item. When revealing it, you
      can produce an item that seems entirely wrong for the situation (it must still
      be obtainable through that plan) and make a Knowledge or Lore check, related
      to the problem or the item, against DC 20 + the CR of the enemy or hazard most
      directly involved. Success: the item works surprisingly well, granting a +2
      circumstance bonus on all rolls that use it as part of the plan, +1 per 5 ranks
      in the associated skill. Failure: the item is as useless as it looks.</p><p><em>Source:
      Spheres of Guile.</em> <a href="http://spheresofpower.wikidot.com/study#toc24">Full
      text</a></p>'
