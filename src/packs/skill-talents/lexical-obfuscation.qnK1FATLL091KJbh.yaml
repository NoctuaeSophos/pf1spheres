  description:
    instructions: ""
    unidentified: ""
    value: '<p><strong>Prerequisites:</strong> Study sphere.</p><p>Spend 1 minute
      touching up to 10 pages of text to permanently erase all writing and symbols
      on them, or to obscure them another way (illegible stains, garbled text, and
      so on). If you spend 1 skill leverage you can also try to dispel scrolls or
      glyph- and symbol-type spells this way, making a caster level check with your
      associated skill ranks in place of caster level; failing by 5 or more triggers
      the spell instead.</p><p><strong>5 ranks in the associated skill:</strong> Spend
      10 minutes touching one page to give it a blank alternate version, swapped by
      speaking a phrase you choose as a standard action. A page can have only one
      alternate at a time. Detect magic reveals dim magic on the page but not its
      real contents; true seeing reveals them.</p><p><em>Source: Diamond Spheres:
      Thaumic Potential.</em> <a href="http://spheresofpower.wikidot.com/study#toc43">Full
      text</a></p>'
