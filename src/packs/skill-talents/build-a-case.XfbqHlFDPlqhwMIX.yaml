  description:
    instructions: ''
    unidentified: ''
    value: '<p>Research topic must be a creature, event, or group. When you learn
      a new piece of information, or meet a creature that seems connected to the topic,
      you can spend 1 minute in contemplation to learn whether it is inconsequential
      to the topic. With 3 or more notions on the research, arriving somewhere new
      instantly draws your eye to whatever person or thing there is unusual and relevant
      to the topic (or tells you there is none).</p><p><strong>Notions:</strong> you
      find a hidden object whose DC to find exceeds 15 + your character level; you
      discover the motivation of a significant creature; you reach a revelation or
      learn something that changes your view of a goal you are pursuing (GM''s call).</p><p><strong>Breakthrough:</strong>
      When using the base ability, spend 1 notion to learn how important the information
      is to the topic, judged by how central it is to uncovering the truth and how
      closely it is tied to the topic.</p><p><strong>Breakthrough:</strong> As a standard
      action, spend any number of notions to gain an equal insight bonus on Appraise,
      Linguistics, Perception, Sense Motive, and Survival checks for 1 hour, and unlock
      skill leverage with those skills for that hour.</p><p><em>Source: Diamond Spheres:
      Thaumic Potential.</em> <a href="http://spheresofpower.wikidot.com/study#toc28">Full
      text</a></p>'
