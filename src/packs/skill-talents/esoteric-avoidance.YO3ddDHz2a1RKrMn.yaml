  description:
    instructions: ''
    unidentified: ''
    value: '<p>Subject must be a creature. You can also start this theory, with 1
      notion right away, when you successfully identify a spell effect on the creature
      or a spell it casts. When you try to identify a magical effect coming from the
      subject, you can expend an attack of opportunity to roll twice and take the
      higher result.</p><p><strong>Notions:</strong> the subject uses a spell, spell-like
      ability, or supernatural ability that takes at least a standard action; another
      creature saves against a harmful magical effect from the subject; one of the
      subject''s spells or spell-like abilities is hacked, dispelled, or countered;
      another creature overcomes the subject''s spell resistance.</p><p><strong>Breakthrough:</strong>
      When the subject targets you with a spell or spell-like ability, spend 3 notions
      as an immediate action to roll its saving throws twice and take the higher.</p><p><strong>Breakthrough:</strong>
      As a swift action, spend 1 notion to give an ally within 30 ft. an additional
      saving throw against a spell or spell-like ability from the subject.</p><p><em>Source:
      Spheres of Guile.</em> <a href="http://spheresofpower.wikidot.com/study#toc31">Full
      text</a></p>'
