  description:
    instructions: ''
    unidentified: ''
    value: '<p>Research topic must concern an area, survival, or hazards. It starts
      with 1 notion if the topic involved underground or natural hazards (Knowledge
      (dungeoneering) or Knowledge (nature)). You gain an insight bonus on saves against
      traps and hazards equal to the research''s current notions.</p><p><strong>Notions:</strong>
      a creature saves against a hazard, or a trap misses a creature; a creature finds
      a hidden trap or hazard with Perception or Survival; a creature succeeds on
      an Acrobatics, Climb, Fly, or Swim check with a DC above 15.</p><p><strong>Breakthrough:</strong>
      Spend 1 notion to reroll any of these failed checks: Acrobatics (balance or
      jump), Climb check, Disable Device check to disarm a trap, Survival check to
      avoid a natural hazard, or similar check whose failure would make you fall (such
      as Fly or Swim). You must keep the new result.</p><p><strong>Breakthrough:</strong>
      Spend 1 notion as a free action, even off-turn, to learn the DC of an Acrobatics,
      Climb, Disable Device, Fly, Survival, or Swim check before you attempt it.</p><p><strong>Breakthrough:</strong>
      When a trap or hazard affects you, spend any number of notions as a free action,
      even off-turn, to delay its damage, poison, or other effects by that many minutes.</p><p><em>Source:
      Spheres of Guile.</em> <a href="http://spheresofpower.wikidot.com/study#toc27">Full
      text</a></p>'
