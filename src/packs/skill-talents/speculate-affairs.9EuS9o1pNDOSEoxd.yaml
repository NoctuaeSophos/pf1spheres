  description:
    instructions: ""
    unidentified: ""
    value: '<p>Research topic must be a specific group, such as a district, faction,
      or cult. You can spend 10 minutes questioning locals or investigating to learn
      whether any member of the group has been in the area and roughly what they did.</p><p><strong>Notions:</strong>
      you perceive or deal with something or someone the group holds in high regard
      (a shrine, statue, patron, etc.); you learn a substantial, new fact about the
      group from a source other than yourself; you take part in an action that shifts
      the group''s balance of power (saving or killing a leader, stealing or recovering
      a key item or person, repairing or destroying a monument).</p><p><strong>Breakthrough:</strong>
      As a swift action, spend 1 notion to choose a creature in the group (or learn
      of a random significant one) and learn its tier: trivial (HD no more than half
      your level), weak (HD = your level - 4), competent (HD = your level), strong
      (HD = your level + 5), or powerful (HD = your level + 10).</p><p><strong>Breakthrough:</strong>
      When using the base ability, spend 2 notions to also learn of one group that
      holds the topic in high regard and one that holds it in low regard.</p><p><strong>Breakthrough:</strong>
      When using the base ability, spend 3 notions to learn a major legend tied to
      the topic, current or half-forgotten but not wholly lost or restricted, usually
      about one creature or small group and a momentous event.</p><p><em>Source: Spheres
      of Guile.</em> <a href="http://spheresofpower.wikidot.com/study#toc34">Full
      text</a></p>'
