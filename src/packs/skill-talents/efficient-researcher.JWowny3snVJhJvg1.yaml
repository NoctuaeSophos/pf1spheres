  description:
    instructions: ''
    unidentified: ''
    value: '<p>You read a 250-word page per round, and inherently magical texts with
      a set reading time (such as a manual of gainful exercise) take a quarter less
      time. Text you write, spellbooks included, needs only a quarter of the usual
      space. Beginning a research topic takes you 30 minutes rather than 1d4 hours,
      and when a research topic gains a notion you can spend 1 skill leverage for
      one extra notion (only one extra per notion gained). Deciphering text with Linguistics
      takes you a full-round action.</p><p><strong>10 ranks in the associated skill:</strong>
      Magical texts with a set reading time take you only half as long. Beating a
      Linguistics decipher DC by 10 or more gives the exact meaning, and a failed
      decipher check never yields a false conclusion.</p><p><strong>Research rules
      (Ultimate Intrigue):</strong> Spend 1 skill leverage to take 10 on a Research
      check. With 10 ranks, your Research checks come every 4 hours rather than every
      8.</p><p><em>Source: Spheres of Guile.</em> <a href="http://spheresofpower.wikidot.com/study#toc11">Full
      text</a></p>'
