  description:
    instructions: ""
    unidentified: ""
    value: '<p>Adopt this approach as a swift action. While in it, you gain a +2 insight
      bonus on saves against (and to the DC to impose on you) effects that cause a
      disorientation condition or confusion, +1 per 5 ranks in the associated skill.</p><p>When
      you succeed on a save against an emotion effect (or resist one inflicted through
      a skill use), you can use an immediate action to force its originator to make
      a Will save or be shocked for 1 round, +1 round per 5 ranks in the associated
      skill. This is a language-dependent, mind-affecting disorientation emotion effect.</p><p>If
      you spend 1 skill leverage when adopting the approach, for its duration, perplexing
      a creature takes only a standard action and pointing out a confusing event only
      an immediate action.</p><p><em>Source: Spheres of Guile.</em> <a href="http://spheresofpower.wikidot.com/study#toc10">Full
      text</a></p>'
