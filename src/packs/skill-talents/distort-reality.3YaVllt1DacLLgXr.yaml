    value: '<p><strong>Prerequisites:</strong> Knowledge (arcana, religion, or planes)
      10 ranks, Study sphere.</p><p>When you finish the research, choose one magic
      item or magical effect. An item''s caster level can be at most your associated
      skill ranks - 4; an effect''s spell level can be at most half your associated
      skill ranks (rounded down) - 3. Reality-altering choices such as wish, miracle,
      or artifacts are not allowed.</p><p><strong>Notions:</strong> you see the chosen
      effect cast or the item activated; you succeed on a skill check to build, create,
      or transform something using a planar trait; you learn from a reliable source
      how the effect or item has been exploited or pushed beyond its limits.</p><p><strong>Breakthrough:</strong>
      Spend any number of notions to cast the chosen effect, using your associated
      skill ranks as caster level; it lasts 1 round per notion spent.</p><p><strong>Breakthrough:</strong>
      Spend any number of notions to conjure the chosen item into your hand or an
      adjacent square for 1 round per notion, with its normal daily uses or charges.
      It is obviously a worthless temporary magical construct (Appraise DC 0).</p><p><em>Source:
      Spheres of Guile.</em> <a href="http://spheresofpower.wikidot.com/study#toc41">Full
      text</a></p>'
