  description:
    instructions: ""
    unidentified: ""
    value: '<p>Subject must be a creature. When it tries to take a 5-foot step away
      from you, or moves so as to flank you, you can take a 5-foot step as an immediate
      action, ending adjacent to it. You cannot take a 5-foot step on your next turn,
      and any movement you take then is reduced by 5 ft.</p><p><strong>Notions:</strong>
      the subject charges, withdraws, or runs; takes a 5-foot step out of an enemy''s
      threatened area; tumbles through an enemy''s square or threatened area with
      Acrobatics; or attempts a bull rush, overrun, reposition, or drag.</p><p><strong>Breakthrough:</strong>
      When using the base ability, spend 2 notions to move up to 10 ft. instead, with
      no restriction on your movement next turn.</p><p><strong>Breakthrough:</strong>
      As an immediate action, spend 2 notions to treat your reach as 5 ft. greater
      for attacks and abilities against the subject until the start of your next turn.</p><p><strong>Associated
      feat:</strong> Step Up.</p><p><em>Source: Spheres of Guile.</em> <a href="http://spheresofpower.wikidot.com/study#toc32">Full
      text</a></p>'
