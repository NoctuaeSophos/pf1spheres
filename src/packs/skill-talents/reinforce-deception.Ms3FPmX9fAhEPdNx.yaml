  description:
    instructions: ""
    unidentified: ""
    value: '<p>Subject must be a creature. You can also start this theory as part
      of perplexing it (a new skill use). When you inflict a disorientation condition
      on the subject, it takes twice as long to orient itself and is distracted by
      you while disoriented; if orienting would take a full-round action or less,
      that time instead worsens by one step (swift, move, standard, full-round, 1
      round).</p><p><strong>Notions:</strong> the subject is outwitted; gains or worsens
      a disorientation condition; has its degree of awareness reduced; or fails an
      opposed Sense Motive check.</p><p><strong>Breakthrough:</strong> As a free action
      when making a Bluff check, spend 2 notions to reduce believability penalties
      on it by 5 (minimum 0); if the lie was already believable, gain a +2 insight
      bonus instead, +1 per 4 ranks in the associated skill.</p><p><strong>Breakthrough:</strong>
      Spend 1 notion as part of an action that inflicts a disorientation effect on
      the subject; if it succeeds, the subject must make a Will save or be unable
      to benefit from competence or circumstance bonuses while it remains disoriented.</p><p><em>Source:
      Spheres of Guile.</em> <a href="http://spheresofpower.wikidot.com/study#toc33">Full
      text</a></p>'
