effects: []
flags:
  pf1: {}
  pf1spheres:
    addedIn: fork
    casterProgression: mid
    buffTemplates:
      inspire-courage:
        name: Inspire Courage
        img: icons/svg/aura.svg
        description:
          "<p>Bardic performance: a morale bonus on saves against charm and fear, and a competence
          bonus on attack and weapon damage rolls (+1, +1 more at 5th, 11th and 17th bard level).</p>"
        changes:
          - formula: 1 + floor((@item.level + 1) / 6)
            target: attack
            type: competence
            operator: add
          - formula: 1 + floor((@item.level + 1) / 6)
            target: wdamage
            type: competence
            operator: add
        contextNotes:
          - text:
              "Inspire Courage: +[[1 + floor((@item.level + 1) / 6)]] morale on saves against charm
              and fear"
            target: allSavingThrows
      inspire-courage-defense:
        name: Inspire Courage (Inspired Defense)
        img: icons/svg/aura.svg
        description:
          "<p>Bardic performance with the marshal's Inspired Defense: the save bonus applies
          to all saves; a competence bonus on attack and weapon damage rolls.</p>"
        changes:
          - formula: 1 + floor((@item.level + 1) / 6)
            target: attack
            type: competence
            operator: add
          - formula: 1 + floor((@item.level + 1) / 6)
            target: wdamage
            type: competence
            operator: add
          - formula: 1 + floor((@item.level + 1) / 6)
            target: allSavingThrows
            type: morale
            operator: add
        contextNotes: []
      inspire-courage-mythic:
        name: Inspire Courage (Inspired Defense, mythic)
        img: icons/svg/aura.svg
        description:
          "<p>Bardic performance with Inspired Defense and a use of mythic power: the save
          bonus applies to all saves and adds the marshal's tier.</p>"
        changes:
          - formula: 1 + floor((@item.level + 1) / 6)
            target: attack
            type: competence
            operator: add
          - formula: 1 + floor((@item.level + 1) / 6)
            target: wdamage
            type: competence
            operator: add
          - formula: 1 + floor((@item.level + 1) / 6) + @caster.details.mythicTier
            target: allSavingThrows
            type: morale
            operator: add
        contextNotes: []
      inspire-competence:
        name: Inspire Competence
        img: icons/svg/aura.svg
        description:
          "<p>Bardic performance: a competence bonus on checks with one skill (+2, +1 per four
          bard levels beyond 3rd).</p>"
        changes: []
        contextNotes:
          - text:
              "Inspire Competence: +[[2 + floor((@item.level - 3) / 4)]] competence on checks with the
              chosen skill"
            target: skills
      inspire-greatness:
        name: Inspire Greatness
        img: icons/svg/aura.svg
        description:
          "<p>Bardic performance: 2 bonus Hit Dice (d10s) with their temporary hit points,
          which count for Hit Dice dependent effects, a +2 competence bonus on attack rolls and +1 competence
          on Fortitude saves.</p>"
        changes:
          - formula: "2"
            target: attack
            type: competence
            operator: add
          - formula: "1"
            target: fort
            type: competence
            operator: add
        contextNotes: []
      dirge-of-doom:
        name: Shaken (Dirge of Doom)
        img: icons/svg/aura.svg
        description:
          "<p>Bardic performance: shaken while within 30 ft. of the bard and able to see and
          hear the performance. It can't make a creature frightened or panicked (mind-affecting fear).</p>"
        changes:
          - formula: "-2"
            target: attack
            type: untyped
            operator: add
          - formula: "-2"
            target: allSavingThrows
            type: untyped
            operator: add
          - formula: "-2"
            target: skills
            type: untyped
            operator: add
          - formula: "-2"
            target: allChecks
            type: untyped
            operator: add
        contextNotes: []
    grants:
      - key: perf:inspire-courage
        target: Bardic Performance
        variants:
          - requires:
              - Inspire Courage
              - Inspired Defense
            name: Inspire Courage
            action:
              activation:
                type: standard
                unchained:
                  type: action
                  cost: 2
              uses:
                autoDeductChargesCost: "1"
              duration:
                units: spec
              notes:
                footer:
                  - Target the allies who can hear you; you are included.
                  - "Bardic performance: start as a standard action (move at 7th level, swift at 13th), then
                    maintain it as a free action each round, spending 1 round of performance per round. One
                    performance at a time; end the effect when it stops."
            automation:
              effect:
                enabled: true
              buff:
                itemId: tpl:inspire-courage-defense
                level: "@classes.bard.level"
                self: true
          - requires:
              - Inspire Courage
            name: Inspire Courage
            action:
              activation:
                type: standard
                unchained:
                  type: action
                  cost: 2
              uses:
                autoDeductChargesCost: "1"
              duration:
                units: spec
              notes:
                footer:
                  - Target the allies who can hear you; you are included.
                  - "Bardic performance: start as a standard action (move at 7th level, swift at 13th), then
                    maintain it as a free action each round, spending 1 round of performance per round. One
                    performance at a time; end the effect when it stops."
            automation:
              effect:
                enabled: true
              buff:
                itemId: tpl:inspire-courage
                level: "@classes.bard.level"
                self: true
      - key: perf:inspire-courage-mythic
        target: Bardic Performance
        variants:
          - requires:
              - Inspire Courage
              - Inspired Defense
            name: Inspire Courage (mythic power)
            action:
              activation:
                type: standard
                unchained:
                  type: action
                  cost: 2
              uses:
                autoDeductChargesCost: "1"
              duration:
                units: spec
              notes:
                footer:
                  - "Inspired Defense with a use of mythic power: spend it with Inspired Defense's own button.
                    Target the allies who can hear you; you are included."
                  - "Bardic performance: start as a standard action (move at 7th level, swift at 13th), then
                    maintain it as a free action each round, spending 1 round of performance per round. One
                    performance at a time; end the effect when it stops."
            automation:
              effect:
                enabled: true
              buff:
                itemId: tpl:inspire-courage-mythic
                level: "@classes.bard.level"
                self: true
      - key: perf:inspire-competence
        target: Bardic Performance
        variants:
          - requires:
              - Inspire Competence
            name: Inspire Competence
            action:
              activation:
                type: standard
                unchained:
                  type: action
                  cost: 2
              uses:
                autoDeductChargesCost: "1"
              duration:
                units: spec
              notes:
                footer:
                  - Target one ally within 30 ft. who can see and hear you (never yourself); name the skill.
                  - "Bardic performance: start as a standard action (move at 7th level, swift at 13th), then
                    maintain it as a free action each round, spending 1 round of performance per round. One
                    performance at a time; end the effect when it stops."
              range:
                units: ft
                value: "30"
            automation:
              effect:
                enabled: true
              buff:
                itemId: tpl:inspire-competence
                level: "@classes.bard.level"
                others: true
      - key: perf:inspire-greatness
        target: Bardic Performance
        variants:
          - requires:
              - Inspire Greatness
            name: Inspire Greatness
            action:
              activation:
                type: standard
                unchained:
                  type: action
                  cost: 2
              uses:
                autoDeductChargesCost: "1"
              duration:
                units: spec
              notes:
                footer:
                  - "Target yourself or willing allies within 30 ft.: one, plus one per three bard levels beyond
                    9th. Each rolls 2d10 + twice its Constitution modifier temporary hit points; with no targets,
                    you get them."
                  - "Bardic performance: start as a standard action (move at 7th level, swift at 13th), then
                    maintain it as a free action each round, spending 1 round of performance per round. One
                    performance at a time; end the effect when it stops."
              range:
                units: ft
                value: "30"
            automation:
              effect:
                enabled: true
              buff:
                itemId: tpl:inspire-greatness
                level: "@classes.bard.level"
              tempHp:
                formula: 2d10 + 2 * @abilities.con.mod
                who: targets
      - key: perf:dirge-of-doom
        target: Bardic Performance
        variants:
          - requires:
              - Dirge of Doom
            name: Dirge of Doom
            action:
              activation:
                type: standard
                unchained:
                  type: action
                  cost: 2
              uses:
                autoDeductChargesCost: "1"
              duration:
                units: spec
              notes:
                footer:
                  - Target the enemies within 30 ft. who can see and hear you. Remove the buff from any that
                    move beyond 30 ft.
                  - "Bardic performance: start as a standard action (move at 7th level, swift at 13th), then
                    maintain it as a free action each round, spending 1 round of performance per round. One
                    performance at a time; end the effect when it stops."
              range:
                units: ft
                value: "30"
            automation:
              effect:
                enabled: true
              buff:
                itemId: tpl:dirge-of-doom
                level: "@classes.bard.level"
                others: true
      - key: perf:soothing-performance
        target: Bardic Performance
        variants:
          - requires:
              - Soothing Performance
            name: Soothing Performance
            action:
              activation:
                type: standard
                unchained:
                  type: action
                  cost: 2
              uses:
                autoDeductChargesCost: "4"
              duration:
                units: inst
              notes:
                footer:
                  - "Mass cure serious wounds at your bard level: apply the healing to each creature (one per
                    bard level, no two more than 30 ft. apart), and remove fatigued, sickened and shaken from
                    them. Takes 4 rounds of continuous performance (charged here)."
                  - "Bardic performance: start as a standard action (move at 7th level, swift at 13th), then
                    maintain it as a free action each round, spending 1 round of performance per round. One
                    performance at a time; end the effect when it stops."
              actionType: heal
              damage:
                parts:
                  - formula: 3d8 + min(35, @classes.bard.level)
                    types:
                      - positive
            automation: {}
