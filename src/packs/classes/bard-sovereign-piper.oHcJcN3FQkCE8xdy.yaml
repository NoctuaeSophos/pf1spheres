  description:
    instructions: ""
    unidentified: ""
    value: '<p>The bard with the Sovereign Piper archetype: a mid-caster sphere caster
      (Charisma) who leads with War and Warleader. d8 Hit Dice, 6 + Int skill ranks,
      medium BAB, good Reflex and Will; the bard''s class skills.</p><p>Keeps bardic
      performance and its performances (inspire courage, countersong, distraction,
      versatile performance, inspire competence, dirge of doom, inspire greatness,
      soothing performance, frightening tune, inspire heroics, deadly performance),
      linked from pf1''s own bard abilities. Trades spells, bardic knowledge, fascinate,
      well-versed, lore master, suggestion, jack of all trades and mass suggestion
      for casting, a spell pool, blended training, masterpiece hymnal, Art of War,
      Martial Lore and Enduring Motivation.</p><p><em>Source: Sovereign Piper (bard
      archetype).</em> <a href="http://spheresofpower.wikidot.com/sovereign-piper">Full
      text</a></p>'
