  description:
    instructions: ''
    unidentified: ''
    value: '<p>Spherecasting conversion of the Paizo witch: a High-Caster who draws
      power from a mysterious patron through her familiar and keeps the witch''s hexes.</p><p><strong>Role:</strong>
      versatile caster whose hexes debuff foes or support allies, while patron talents
      steer her toward one sphere.</p><p><strong>Alignment:</strong> any. <strong>Hit
      Die:</strong> d6. <strong>Starting wealth:</strong> 3d6 × 10 gp (avg. 105 gp).</p><p><strong>Class
      skills:</strong> Craft, Fly, Heal, Intimidate, Knowledge (arcana, history, nature,
      planes), Profession, Spellcraft, Use Magic Device. <strong>Skill ranks per level:</strong>
      2 + Int modifier.</p><p><strong>Progression:</strong> half BAB; good Will, poor
      Fort and Reflex. 1st: casting, spell pool, a magic talent every level, a hex,
      familiar, patron (bonus patron-sphere talent at 1st and every odd level). A
      new hex at 2nd and every even level after; major hexes become selectable at
      10th and grand hexes at 18th.</p><p><strong>Proficiencies:</strong> simple weapons;
      no armor or shields.</p><p><em>Source: Ultimate Spheres of Power.</em> <a href="http://spheresofpower.wikidot.com/sphere-witch">Full
      text</a></p>'
