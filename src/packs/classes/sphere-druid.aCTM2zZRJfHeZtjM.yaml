  description:
    instructions: ""
    unidentified: ""
    value: '<p>Spherecasting conversion of the Paizo druid: a High-Caster guardian
      of the wild who leans on the Nature, Weather and Alteration spheres in place
      of druid spells and wild shape.</p><p><strong>Role:</strong> flexible nature
      caster who can fight through companions, terrain magic or her own shapeshifting.</p><p><strong>Alignment:</strong>
      any neutral. <strong>Hit Die:</strong> d8. <strong>Starting wealth:</strong>
      2d6 × 10 gp (avg. 70 gp).</p><p><strong>Class skills:</strong> Climb, Craft,
      Fly, Handle Animal, Heal, Knowledge (geography), Knowledge (nature), Perception,
      Profession, Ride, Spellcraft, Survival, Swim. <strong>Skill ranks per level:</strong>
      4 + Int modifier.</p><p><strong>Progression:</strong> ¾ BAB; good Fort and Will,
      poor Reflex. 1st: casting, spell pool, natural magic, nature bond, nature sense,
      wild empathy, Druidic. Magic talent every even level. Bonus Nature/Weather talents
      at 1st, 3rd, 7th, 11th, 15th and 19th. 2nd woodland stride; 3rd trackless step;
      4th resist nature''s lure and wild heart (Alteration bonus at 4th, 10th, 16th);
      9th venom immunity; 13th a thousand faces; 15th timeless body; 20th permanent
      self-shapeshift.</p><p><strong>Proficiencies:</strong> club, dagger, dart, quarterstaff,
      scimitar, scythe, sickle, shortspear, sling, spear; light and medium armor (nonmetal);
      wooden shields (no tower shields).</p><p><em>Source: Ultimate Spheres of Power.</em>
      <a href="http://spheresofpower.wikidot.com/sphere-druid">Full text</a></p>'
