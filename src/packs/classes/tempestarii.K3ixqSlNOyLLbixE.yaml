  description:
    instructions: ''
    unidentified: ''
    value: '<p>Prestige class for weather mages who command the skies, from speeding
      an airship along to tearing an enemy vessel down.</p><p><strong>Requirements:</strong>
      caster level 5 with the Weather sphere; the Weather sphere; 5 ranks in Knowledge
      (nature).</p><p><strong>Alignment:</strong> any. <strong>Hit Die:</strong> d6.</p><p><strong>Class
      skills:</strong> Fly, Intimidate, Knowledge (geography), Knowledge (nature),
      Perception, Profession, Spellcraft, Survival. <strong>Skill ranks per level:</strong>
      4 + Int modifier.</p><p><strong>Progression (5 levels):</strong> half BAB (+2
      at 5th); good Will (+3), poor Fort and Reflex (+2). +1 caster level and 1 magic
      talent every level. 1st rapid weather; 2nd ship smasher; 3rd grand weather;
      4th ship killer; 5th deadly weather and instant weather.</p><p><strong>Proficiencies:</strong>
      none.</p><p><em>Source: Woodfaring Adventures.</em> <a href="http://spheresofpower.wikidot.com/tempestarii">Full
      text</a></p>'
