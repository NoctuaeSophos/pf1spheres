    value: '<p>Spherecasting conversion of the Paizo arcanist: a High-Caster who reshapes
      part of her talent selection every day and burns an arcane reservoir to push
      her sphere effects and exploits.</p><p><strong>Role:</strong> adaptable scholar
      of magic who can re-tool for each day''s problem and drain or counter enemy
      magic.</p><p><strong>Alignment:</strong> any. <strong>Hit Die:</strong> d6.
      <strong>Starting wealth:</strong> 2d6 × 10 gp (avg. 70 gp).</p><p><strong>Class
      skills:</strong> Appraise, Craft, Fly, Knowledge (all), Linguistics, Profession,
      Spellcraft, Use Magic Device. <strong>Skill ranks per level:</strong> 2 + Int
      modifier.</p><p><strong>Progression:</strong> half BAB; good Will, poor Fort
      and Reflex. 1st: casting, spell pool, arcane reservoir, an exploit, consume
      spells. Moldable talent at every odd level; regular magic talent at every even
      level. New exploit at 1st and every odd level; greater exploits selectable from
      11th. 20th: magical supremacy.</p><p><strong>Proficiencies:</strong> simple
      weapons; no armor or shields.</p><p><em>Source: Ultimate Spheres of Power.</em>
      <a href="http://spheresofpower.wikidot.com/sphere-arcanist">Full text</a></p>'
