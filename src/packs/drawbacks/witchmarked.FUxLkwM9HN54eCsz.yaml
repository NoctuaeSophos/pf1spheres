  description:
    instructions: ""
    unidentified: ""
    value: '<p>Some cosmetic feature that is hard to hide (a vestigial tail, glowing
      eyes, a visible aura, a smell of death) marks the caster as magical, and it
      grows more pronounced as she gains power. Anyone who sees her can attempt a
      Knowledge (arcana) check (DC 20 − her magic skill bonus, minimum 0) to learn
      her magic skill bonus, caster level and base spheres.</p><p>Hiding the mark
      takes a Disguise check (DC 10 + magic skill bonus, rolled secretly); if it is
      hidden as part of a larger disguise, that Disguise check takes a penalty equal
      to her magic skill bonus instead. A magical disguise (illusion, shapechange
      and the like) hides it automatically, but using any magic that doesn''t specifically
      conceal the mark exposes it to everyone watching.</p><p>Incompatible with Magical
      Signs.</p><p><em>Source: Ultimate Spheres of Power.</em> <a href="http://spheresofpower.wikidot.com/casting-traditions#toc66">Full
      text</a></p>'
