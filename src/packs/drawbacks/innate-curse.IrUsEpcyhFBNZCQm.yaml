  description:
    instructions: ""
    unidentified: ""
    value: '<p>The caster suffers the hindrance of one oracle curse, chosen with the
      GM, but gains none of its benefits or level-based improvements. Her magic skill
      bonus stands in for oracle level when working out the hindrance''s penalties.
      The curse is permanent and can''t be removed.</p><p>The GM decides which curses
      are suitable.</p><p>If she has or later gains an oracle''s curse from another
      source, she keeps both, but they must be different curses granting different
      kinds of benefits, even without the Curse Mastery feat.</p><p><em>Source: Spheres
      Apocrypha: Casting Traditions 2.</em> <a href="http://spheresofpower.wikidot.com/casting-traditions#toc35">Full
      text</a></p>'
