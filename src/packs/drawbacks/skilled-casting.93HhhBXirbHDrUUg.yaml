  description:
    instructions: ""
    unidentified: ""
    value: '<p>Your magic runs through a Perform, Profession or Craft skill (or another
      the GM allows). Each sphere ability needs a check against DC 15 + its caster
      level; for every 2 points you miss by, it takes effect at 1 lower caster level,
      and if that falls below 0 it fails and its spell points are lost. Drawn magic
      needs a free hand; music needs speech but can be whispered (which avoids Verbal
      Casting''s stealth break unless you also have it). Counts as 1 drawback, or
      2 if the GM agrees the skill needs bulky tools or both hands.</p><p><strong>Taken
      a second time:</strong> pick two more skills, three in all, and assign each
      of your spheres to one; each sphere''s abilities check with its skill (a multi-sphere
      effect rolls once per sphere). No skill may carry more than one sphere above
      the skill with the fewest.</p><p><em>Source: Casting traditions.</em> <a href="http://spheresofpower.wikidot.com/casting-traditions">Full
      text</a></p>'
