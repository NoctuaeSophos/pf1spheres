  description:
    instructions: ""
    unidentified: ""
    value: '<p>The caster starts out focused. Focus is lost on any of these: failing
      a saving throw against mind-affecting magic; being dealt a confirmed critical
      hit; or anything that leaves her unable to concentrate, such as the nauseated
      or helpless conditions or failing a mandatory concentration check (entanglement,
      for instance).</p><p>While unfocused, she must pass a concentration check (DC
      20 + 1/2 caster level) every time she uses magic; if it fails, the time and
      any spell points are wasted and nothing happens.</p><p>Meditating for a full-round
      action, which provokes attacks of opportunity, restores focus.</p><p><em>Source:
      Ultimate Spheres of Power.</em> <a href="http://spheresofpower.wikidot.com/casting-traditions#toc40">Full
      text</a></p>'
