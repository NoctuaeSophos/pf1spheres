  description:
    instructions: ''
    unidentified: ''
    value: '<p>To use or concentrate on any of her sphere abilities, the caster must
      wield a proficient martial or exotic weapon that has at least some metal in
      it (metal decoration on a wooden weapon counts). She must be able to attack
      with it, and it can''t have the broken condition; it needs no special properties.</p><p>Being
      disarmed of the weapon or having it sundered counters every sphere ability she
      is casting or maintaining. If a polymorph effect merges the weapon into her
      body, she can''t use her abilities unless she can still attack with it somehow.</p><p>She
      may swap between qualifying weapons while maintaining sphere abilities.</p><p>Incompatible
      with Center of Power and Focus Casting.</p><p><em>Source: Ultimate Spheres of
      Power.</em> <a href="http://spheresofpower.wikidot.com/casting-traditions#toc33">Full
      text</a></p>'
