    value:
      "<p>You may create a ward that protects creatures within from projectiles, including projectile
      weapons, thrown rocks, rays made up of projectiles (such as created by the Stone Blast talent of
      the Destruction sphere) or falling debris. Any damage of that type dealt within this area is reduced
