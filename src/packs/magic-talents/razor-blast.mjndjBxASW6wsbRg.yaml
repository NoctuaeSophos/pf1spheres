  description:
    instructions: ""
    unidentified: ""
    value:
      "<p>You craft your destructive blast into a series of jagged crystal shards, dealing slashing
      damage and using d4 instead of d6 as its damage die. Any creature struck by the attack or that failed
      their Reflex saving throw if one was required must succeed at a Reflex save or have its movement
      speed reduced in half until 24 hours pass, or it receives at least 1 point of fast healing/magical
      healing/regeneration. This effect may also be healed as a caltrop wound. In addition, every space
      affected by the razor blast becomes covered in jagged crystals. Any creature who moves over such
      a space must succeed at a Reflex save or suffer 1 point of damage and have its speed reduced by
      half, as detailed above.</p>

      <p>A charging or running creature must immediately stop if it fails this saving throw. Any creature
      moving at half speed or slower can pick its way through the area with no trouble. A creature need
      only attempt one saving throw per round to avoid this effect, no matter how many affected spaces
      they cross over that round. Crystals can also be destroyed by dealing 1 point of damage per caster
      level to the crystal in a particular space. Crystal also disappears after 1 minute.</p>

      "
