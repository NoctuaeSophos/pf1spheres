    value:
      "<p>Your destructive blast becomes a stream of jagged blades, dealing slashing damage, and
      using d4 instead of d6 as its damage die. Any creature struck by the attack or that failed their
      Reflex saving throw if one was required suffers bleed damage equal to 1/2 the number of damage die
      rolled (minimum 1). The blast ignores spell resistance, spell turning, and can penetrate a globe
      of invulnerability, antimagic field, or other forms of antimagic, and is not treated as a spell
      or magical for the purpose of bypassing damage reduction, damaging incorporeal creatures, or for
      creatures or classes that gain a bonus to saving throws against magic. These blades disappear after
      1 minute.</p>

      "
