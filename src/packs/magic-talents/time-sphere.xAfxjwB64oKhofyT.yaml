        name: Haste (Time Sphere)
        img: icons/svg/ice-aura.svg
        description:
          <p>Time sphere alter time. Set this buff's level to the caster's Time caster level
          when applying it to someone else. +10 ft. enhancement to all speeds (+10 per 5 CL), +1 attack
          and +1 dodge to AC and Reflex (+1 per 10 CL). Concentration, or 1 spell point for 1 round per
          caster level.</p>
        changes:
          - formula: 10 + 10 * floor(@item.level / 5)
            target: allSpeeds
            type: enh
            operator: add
          - formula: 1 + floor(@item.level / 10)
            target: attack
            type: untyped
            operator: add
          - formula: 1 + floor(@item.level / 10)
            target: ac
            type: dodge
            operator: add
          - formula: 1 + floor(@item.level / 10)
            target: ref
            type: dodge
            operator: add
      slow-time-sphere:
        name: Slow (Time Sphere)
        img: icons/svg/ice-aura.svg
        description:
          <p>Time sphere alter time (Will negates). Set the level to the caster's Time caster
          level. Speeds halved; −1 to attack, AC and Reflex (−1 more per 10 CL).</p>
        changes:
          - formula: -1 - floor(@item.level / 10)
            target: attack
            type: untyped
            operator: add
          - formula: -1 - floor(@item.level / 10)
            target: ac
            type: untyped
            operator: add
          - formula: -1 - floor(@item.level / 10)
            target: ref
            type: untyped
            operator: add
