  pf1spheres:
    sphere: destruction
    grants:
      - key: blast:invigorating-blast
        target: Destruction Sphere
        variants:
          - name: Invigorating Blast
            action:
              damage:
                parts:
                  - formula: (ceil(@spheres.cl.destruction.total / 2))d4
                    types:
                      - positive
              conditionals:
                - _id: HRXuoAzKghxE5S2B
                  name: "Spend 1 spell point: one damage die per caster level (minimum 2)"
                  default: false
                  modifiers:
                    - _id: GhIETS9oXiadwTO0
                      formula: (max(2, @spheres.cl.destruction.total) - ceil(@spheres.cl.destruction.total / 2))d4
                      target: damage
                      subTarget: allDamage
                      type: untyped
                      critical: normal
                      damageType:
                        - positive
              notes:
                footer:
                  - "Ranged touch within close range; counts as a ray. Destructive blast: subject to spell resistance;
                    bypasses DR/magic but not other damage reduction. One (blast type) and one (blast shape)
                    per blast."
              save:
                type: fort
                dc: 10 + floor(@spheres.cl.destruction.total / 2) + @spheres.cam
                description: Fortitude negates the effect
            notes:
              - "Invigorating Blast: Damages only non-living creatures. Living creatures instead gain that many
                temporary hit points (up to their maximum hp) for 1 hour, and must make the Fortitude save or
                be dazed for 1 round."
              - Invigorating Blast costs 1 spell point on top of any enhancement.
            automation:
              sp: "1"
              onFail:
                conditions: dazed
                conditionRounds: "1"
