  description:
    instructions: ''
    unidentified: ''
    value: '<p><strong>Prerequisites:</strong> Destruction sphere (any (blast type)
      talent), Nature sphere (any package).</p><p>When the caster''s destructive blast
      uses a (blast type) talent from a category that matches a Nature geomancing
      package she has, she may add her casting ability modifier to the blast''s attack
      and damage rolls. If she does, no other ability modifier (Strength, Dexterity
      or any other she could normally use) applies to those rolls. If the blast rides
      on a weapon or natural attack (Energy Strike and the like), the feat applies
      to that attack''s attack and damage rolls instead, replacing their ability modifiers.</p><p>Matching
      categories: (air) package: air, electric, sonic; (earth): crystal, stone; (fire):
      fire, light; (metal): acid, electric; (plant): acid, force; (water): cold, crystal.</p><p>The
      casting modifier is added as its own flat bonus rather than swapped into the
      normal ability slot, so it isn''t multiplied (for example, no 1.5× for a two-handed
      weapon with Energy Strike).</p><p><em>Source: Ultimate Spheres of Power.</em>
      <a href="http://spheresofpower.wikidot.com/destruction#toc138">Full text</a></p>'
