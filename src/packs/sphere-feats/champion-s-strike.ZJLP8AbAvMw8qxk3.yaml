      champions-strike:
        name: Champion's Strike (Imbued Strike)
        img: icons/svg/aura.svg
        active: true
        description: "<p>Imbued Strike is always in effect: weapons deal extra damage
          (+1, +1 per 5 magic skill bonus, maximum +5) and count as magic for damage
          reduction. With an attack action that has one target and one attack roll,
          that bonus rises 100% per +5 base attack bonus. Don't also use Imbued Strike's
          own buff, which doesn't stack with this.</p>"
        changes:
          - formula: min(5, 1 + floor(@spheres.msb.total / 5))
            target: wdamage
            type: untyped
        contextNotes:
          - text: "Champion's Strike: your weapons count as magic against damage reduction"
            target: attack
          - text: "Champion's Strike: with an attack action that has one target and
              one attack roll, imbued strike deals +[[min(5, 1 + floor(@spheres.msb.total
              / 5)) * floor(@attributes.bab.total / 5)]] more damage"
            target: wdamage
    grantItems:
      - champions-strike
