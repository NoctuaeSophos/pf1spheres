  description:
    instructions: ""
    unidentified: ""
    value: '<p><strong>Prerequisites:</strong> War sphere, bardic performance or raging
      song.</p><p>When you start a song (a standard action) you may create a totem
      as part of the same action, or attach a totem you create later. An attached
      totem affects only allies affected by the song, never enemies, and lasts as
      long as the song does with no concentration or spell point upkeep (you still
      pay its creation cost). Allies affected by an attached totem can be rallied;
      with raging song, being able to accept the song is enough. End an attached totem
      as a free action. If you can move totems, you can attach and detach them the
      way you move totemic auras.</p><p><em>Source: War sphere feats.</em> <a href="http://spheresofpower.wikidot.com/war">Full
      text</a></p>'
