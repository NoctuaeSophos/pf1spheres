  description:
    instructions: ""
    unidentified: ""
    value: '<p>An evil spirit shares your body. It starts each day with 1 influence
      at sunrise and gains 1 more whenever you rest or become confused, dazed, frightened,
      panicked or stunned; you lose any immunity to those conditions.</p><p>When it
      reaches 5 influence, attempt a Will save (DC 15 + your manifestation level,
      +2 for each earlier attempt that day). On a failure the corruption advances:
      at stage 1 your alignment shifts toward the spirit''s and it controls you until
      sunrise; at stage 2 your alignment changes; at stage 3 you become an NPC.</p><p>You
      gain manifestations as your corruption grows, roughly one every 2 levels.</p><p>Track
      the spirit with the Corruption button on the character sheet.</p><p><em>Source:
      Pathfinder RPG Horror Adventures.</em> <a href="https://aonprd.com/CorruptionsDisplay.aspx?ItemName=Possessed">Full
      text</a></p>'
