  description:
    instructions: ""
    unidentified: ""
    value: '<p>These are the boons for Deific Obedience characters with no evangelist
      or sentinel levels (gained at 12/16/20 HD, or sooner with exalted levels).</p><p><strong>1.
      Cloud the Mind of the Unwary (Sp):</strong> hypnotism 3/day, daze monster 2/day,
      or suggestion 1/day.</p><p><strong>2. Repair the Damaged Body (Su):</strong>
      up to 3/day, a conjuration (healing) spell you cast that has a range of touch
      can instead have close range.</p><p><strong>3. Walk Above the Earth (Su):</strong>
      you constantly float a few inches off the ground, as levitate. Your speed is
      unchanged. You ignore most difficult terrain and pressure-triggered traps, and
      other effects at the GM''s call. You can hover only above solid surfaces, so
      you fall off a ledge or onto liquid, but you can rise or sink as levitate allows.
      You take no levitate attack or damage penalties while hovering at ground level;
      if you use a move action to rise higher, you take them until you come back down.</p><p><em>Source:
      Inner Sea Gods pg. 84.</em> <a href="https://www.aonprd.com/DeityDisplay.aspx?ItemName=Irori">Full
      text</a></p>'
