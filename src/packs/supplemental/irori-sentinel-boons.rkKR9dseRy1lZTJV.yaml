    unidentified: ''
    value: '<p>These are the boons for sentinels of Irori.</p><p><strong>1. Masterful
      Warrior (Sp):</strong> true strike 1/day, false life 2/day, or haste 3/day.</p><p><strong>2.
      Secrets of the Enemy (Ex):</strong> as a standard action in combat, attempt
      a Knowledge check for the foe''s creature type (DC 10 + its Hit Dice). On a
      success, your weapon attacks against that foe get +2 to hit and +2 damage. On
      a failure, you can try again with another action, but each later attempt against
      the same foe takes a cumulative -2.</p><p><strong>3. Perfection of Form (Ex):</strong>
      +4 sacred or profane bonus on saves vs poison, vs magical or supernatural disease,
      and vs anything that inflicts ability damage, ability drain or negative levels.
      Mundane diseases cannot affect you.</p><p><em>Source: Inner Sea Gods pg. 84.</em>
      <a href="https://www.aonprd.com/DeityDisplay.aspx?ItemName=Irori">Full text</a></p>'
