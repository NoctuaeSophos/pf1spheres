  description:
    instructions: ""
    unidentified: ""
    value: '<p><strong>Prerequisites:</strong> Weapon Finesse.</p><p>With a light
      weapon, or any weapon Weapon Finesse applies to (a rapier, for example), add
      your Dexterity modifier to damage in place of Strength. Off-hand attacks get
      the same fraction of Dexterity they would of Strength.</p><p><em>Pre-errata
      version:</em> also required BAB +1; the bonus didn''t grow for two-handed weapons
      and wasn''t halved off-hand.</p><p>On the sheet, set the weapon attack''s damage
      ability to Dexterity.</p><p><em>Source: Path of War p. 20.</em> <a href="https://metzo.miraheze.org/wiki/Deadly_Agility">Full
      text</a></p>'
