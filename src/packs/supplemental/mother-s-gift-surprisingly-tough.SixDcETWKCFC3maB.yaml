    unidentified: ''
    value: '<p><strong>Prerequisites:</strong> Changeling.</p><p>Mother''s Gift is
      a changeling feat with three manifestations. You choose one when you take it,
      and the choice is permanent. This item is the <strong>Surprisingly Tough (Ex)</strong>
      manifestation: your natural armor bonus rises by 1.</p><p>You can take the feat
      up to three times, picking a different manifestation each time. The manifestations
      don''t stack. The others are Hag Claws (+1 attack and damage with claws) and
      Uncanny Resistance (spell resistance 6 + character level).</p><p>Taking this
      feat satisfies the Mother''s Gift prerequisite of Awakened Hag Heritage.</p><p><em>Source:
      Advanced Race Guide pg. 185.</em> <a href="https://www.aonprd.com/FeatDisplay.aspx?ItemName=Mother%27s%20Gift">Full
      text</a></p>'
