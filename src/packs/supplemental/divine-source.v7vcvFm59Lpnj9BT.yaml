  description:
    instructions: ''
    unidentified: ''
    value: '<p><strong>3rd-tier universal path ability.</strong> Your followers can
      take you as their deity when choosing spells and domains.</p><p><strong>Domains:</strong>
      choose two when you take this ability. Unless you are neutral, they must be
      alignment domains matching your alignment where possible. You grant them as
      a deity would. Followers who draw spells from you lose any spell slots of a
      level higher than your tier.</p><p><strong>Your own casting:</strong> each day
      you can cast, as spell-like abilities, one spell of each level up to your tier,
      chosen from your granted domains'' spells. If you are a cleric or worship a
      deity, you may also switch your own domains to the ones you grant.</p><p><strong>Repeat
      picks:</strong> you can take it again at 6th tier and at 9th tier. Each time,
      add one domain and two subdomains (Advanced Player''s Guide) to the list you
      grant and can cast from.</p><p><em>Source: Mythic Adventures pg. 51.</em> <a
      href="https://www.aonprd.com/PathAbilities.aspx?Path=Universal">Full text</a></p>'
