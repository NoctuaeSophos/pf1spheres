    value: '<p><strong>Tier 3.</strong> Any 8-hour rest restores you to full hit points,
      as long as you are not dead.</p><p><strong>Short rest:</strong> spend 1 use
      of mythic power and rest 1 hour. You heal half your full hit points (never above
      full) and regain daily-limited class features such as rage rounds, bardic performance
      and spells per day. For those features the hour counts as 8 hours of sleep.</p><p>The
      short rest does not refresh mythic power or any mythic ability with a per-day
      limit.</p><p><em>Source: Mythic Adventures pg. 12.</em> <a href="https://www.aonprd.com/Rules.aspx?Name=Base%20Mythic%20Abilities&Category=Mythic%20Heroes">Full
