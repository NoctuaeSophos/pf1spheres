  description:
    instructions: ""
    unidentified: ""
    value:
      '<p><strong>Ritual (1 hour, divided equally):</strong> drill with a weapon or unarmed attacks,
      read a text you have never read before, and braid a lock of hair while contemplating the multiverse.
      Then wear the braid around your neck for the rest of the day.</p><p><strong>Benefit:</strong> +4
      sacred or profane bonus on all Knowledge checks. Good characters take sacred and evil characters
      take profane. If you are neither, choose one the first time you perform the obedience; that choice
      is permanent.</p><p><em>Source: Inner Sea Gods pg. 84.</em> <a href="https://www.aonprd.com/DeityDisplay.aspx?ItemName=Irori">Full
      text</a></p><p><strong>Boons</strong> (Inner Sea Gods pg. 84). Exalted, used without evangelist,
      exalted or sentinel levels: 12 HD Cloud the Mind of the Unwary (hypnotism 3/day, daze monster 2/day
      or suggestion 1/day); 16 HD Repair the Damaged Body; 20 HD Walk Above the Earth. Evangelist: Expansive
      Knowledge (identify 3/day, fox''s cunning 2/day or secret page 1/day); Inevitable Fist (unarmed
      strikes one size larger and axiomatic for HD rounds/day); Runic Form (nine tattoos of mind, body
      and spirit). Sentinel: Masterful Warrior (true strike 1/day, false life 2/day or haste 3/day); Secrets
      of the Enemy (Knowledge check DC 10 + enemy HD for +2 attack and damage against it); Perfection
      of Form (+4 on saves against poison, magical disease and ability damage, drain or negative levels;
      immune to mundane disease).</p><p><em>Not Spheres content: this belongs in the krune-table module
      or a separate supplement and lives here for now.</em></p>'
