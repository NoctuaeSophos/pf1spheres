  description:
    instructions: ''
    unidentified: ''
    value: '<p><strong>Ritual (1 hour, divided equally):</strong> drill with a weapon
      or unarmed attacks, read a text you have never read before, and braid a lock
      of hair while contemplating the multiverse. Then wear the braid around your
      neck for the rest of the day.</p><p><strong>Benefit:</strong> +4 sacred or profane
      bonus on all Knowledge checks. Good characters take sacred and evil characters
      take profane. If you are neither, choose one the first time you perform the
      obedience; that choice is permanent.</p><p><em>Source: Inner Sea Gods pg. 84.</em>
      <a href="https://www.aonprd.com/DeityDisplay.aspx?ItemName=Irori">Full text</a></p>'
