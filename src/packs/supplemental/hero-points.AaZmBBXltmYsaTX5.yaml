  description:
    instructions: ''
    unidentified: ''
    value: '<p><strong>Earning:</strong> PCs only (not cohorts, companions, familiars
      or mounts). Start with 1, gain 1 per level gained, plus any the GM awards for
      heroics, story arcs and so on. You can hold at most 3, and any excess is lost.
      Spent points never come back on their own. A PC who dies with none gains 1 when
      raised or resurrected.</p><p><strong>Spending:</strong> takes no action, at
      any time, but no more than 1 per round of combat. Each point does one of the
      following:</p><p><strong>Act Out of Turn:</strong> take your turn now, as if
      readying, moving your initiative to just before the current creature. Only a
      move or a standard action. <strong>Bonus:</strong> +8 luck bonus on one d20
      roll if spent before rolling, +4 if spent after. You can give it to an ally
      you could plausibly help, at half value (+4 before, +2 after). <strong>Extra
      Action:</strong> one extra standard or move action on your turn. <strong>Inspiration:</strong>
      ask the GM for a hint; the point is refunded if there is nothing to learn. <strong>Recall:</strong>
      regain one spell already cast or one use of a daily-recharging limited ability.
      <strong>Reroll:</strong> reroll a d20 you just rolled, keeping the second result.
      <strong>Special:</strong> with GM approval, attempt something nearly impossible,
      usually with a hard check or attack penalty, and no further hero points can
      be spent on it.</p><p><strong>Cheat Death (2 points):</strong> survive an otherwise
      fatal blow. You are typically left negative and stable, as the GM narrates.</p><p><em>Source:
      Advanced Player''s Guide pg. 322.</em> <a href="https://www.aonprd.com/Rules.aspx?Name=Hero%20Points&Category=Advanced%20Player%27s%20Guide">Full
      text</a></p>'
