  description:
    instructions: ""
    unidentified: ""
    value: '<p>You own a permanent extradimensional pocket. Capacity: 5 lb. plus 5
      lb. per five character levels, and no single object (or bundle) bigger than
      Small.</p><p>Storing an unattended inanimate object you touch, or retrieving
      one object, is a full-round action each. If you die (or are destroyed, lacking
      Con), the contents spill into your square or the nearest open one.</p><p>It
      counts as Extradimensional Storage (Warp) for effects that interact with that
      talent, and merges into that space if you later take the talent.</p><p><em>Source:
      Traits (Spheres of Power wiki).</em> <a href="http://spheresofpower.wikidot.com/traits">Full
      text</a></p>'
