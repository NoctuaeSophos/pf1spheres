    value:
      '<p><strong>Prerequisites:</strong> Iron Will or Mother''s Gift; changeling.</p><p><strong>General
      benefit:</strong> +2 racial bonus on saves against arcane spells. You also gain
      a second ability set by your hag heritage.</p><p><strong>Sea-born (brine may)
      ability:</strong> you gain a swim speed matching your base land speed and need
      no Swim checks to move in water; Swim is a class skill. (The sea-born hag racial
      trait itself lets you hold your breath for three times your Constitution score
      in rounds.)</p><p><strong>Side effect:</strong> each midnight there is a 50%
      chance that for the next 24 hours you register as evil to divinations, and small
      signs of corruption (spoiling milk, curling pages) occur around you at the GM''s
      discretion.</p><p><em>Source: Blood of the Coven pg. 4.</em> <a href="https://www.aonprd.com/FeatDisplay.aspx?ItemName=Awakened%20Hag%20Heritage">Full
      text</a></p>'
