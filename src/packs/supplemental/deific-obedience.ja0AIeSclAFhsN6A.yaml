  description:
    instructions: ""
    unidentified: ""
    value: '<p><strong>Prerequisites:</strong> Knowledge (religion) 3 ranks; must
      worship a deity.</p><p><strong>Obedience:</strong> perform your deity''s daily
      obedience, which takes at most 1 hour. Once it is done, you gain the benefit
      listed in your deity''s Obedience entry.</p><p><strong>Boons by Hit Dice:</strong>
      first boon at 12 HD, second at 16 HD, third at 20 HD. A boon is constant unless
      it lists a duration or uses per day.</p><p><strong>Which boons:</strong> with
      no evangelist, exalted or sentinel levels you use the exalted boons. Levels
      in one of those prestige classes grant boons sooner. If you later take sentinel
      or evangelist levels, you swap the exalted boons for that class''s boons.</p><p><strong>Missed
      obedience:</strong> if you skip a day''s obedience, every benefit and boon from
      this feat stops working until you perform it again.</p><p><em>Source: Inner
      Sea Gods pg. 210.</em> <a href="https://www.aonprd.com/FeatDisplay.aspx?ItemName=Deific%20Obedience">Full
      text</a></p>'
