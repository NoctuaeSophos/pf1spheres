    unidentified: ''
    value: '<p>These are the boons for evangelists of Irori.</p><p><strong>1. Expansive
      Knowledge (Sp):</strong> identify 3/day, fox''s cunning 2/day, or secret page
      1/day.</p><p><strong>2. Inevitable Fist (Su):</strong> you have rounds per day
      equal to your Hit Dice in which your unarmed strikes use the damage of a creature
      one size category bigger and gain the axiomatic property. Activating or ending
      it costs a free action; spend the rounds in any increments.</p><p><strong>3.
      Runic Form (Sp and Su):</strong> you gain nine runic tattoos, three each for
      mind, body and spirit. Discharging one is a standard action unless noted. A
      spent tattoo recharges over 1 week.<br>Body: two hold cure serious wounds and
      one holds restoration (spell-like).<br>Mind: two each let you reroll a save
      against an enchantment as a swift action, declared before you learn the result,
      and you must keep the new roll. The third grants a +4 sacred bonus to Wisdom
      for 1 minute.<br>Spirit: two each make you ethereal for 1 minute, as etherealness.
      The third grants spell resistance of 10 + your Hit Dice for 1 minute.</p><p><em>Source:
      Inner Sea Gods pg. 84.</em> <a href="https://www.aonprd.com/DeityDisplay.aspx?ItemName=Irori">Full
      text</a></p>'
