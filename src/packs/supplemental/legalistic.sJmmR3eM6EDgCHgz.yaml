  description:
    instructions: ""
    unidentified: ""
    value: '<p><strong>Penalty:</strong> whenever you break your word, deliberately
      or by accident, you are sickened for 24 hours or until you make good on the
      obligation, whichever comes first.</p><p><strong>Vow (1st):</strong> once per
      day, make a private vow. You gain a +4 morale bonus on one roll made while working
      to keep a promise you gave to someone else.</p><p><strong>5th level:</strong>
      while talking with just one individual, you get a +3 competence bonus to Diplomacy,
      Intimidate and Sense Motive.</p><p><strong>10th level:</strong> while under
      a mind-affecting effect, you get a new saving throw against it every minute.</p><p><strong>15th
      level:</strong> for 24 hours after a creature breaks a promise it willingly
      made to you, it suffers a penalty equal to your Charisma modifier (minimum 1)
      to AC, to spell resistance, and on saves against your attacks and abilities.</p><p><em>Source:
      Blood of Fiends pg. 26.</em> <a href="https://www.aonprd.com/OracleCurses.aspx">Full
      text</a></p>'
