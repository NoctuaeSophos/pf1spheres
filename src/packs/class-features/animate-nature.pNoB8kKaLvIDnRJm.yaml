  description:
    instructions: ""
    unidentified: ""
    value: '<p>From 2nd level, as a full-round action she spends 1 spell point and
      targets suitable material within her Nature sphere geomancing range, matching
      one of her Nature packages, to create a primal elemental of that package. It
      is friendly and does specific tasks she communicates to it, though she has no
      special link to it. It lasts 1 minute per class level; she can have only one
      at a time, and making a new one returns the old one to inert material.</p><p><strong>Size
      by level (material needed):</strong> 2nd Small (5-ft. cube, or a Small metal
      object); 5th Medium (10-ft. cube or Medium metal object); 8th Large (15-ft.
      cube or Large metal object); 11th Huge (20-ft. cube or Huge metal object); 14th
      greater (25-ft. cube or Gargantuan metal object; costs 1 extra spell point);
      17th elder (same material; takes 1 round and costs 2 extra spell points instead).</p><p><strong>Replaces:</strong>
      Wild Shape; A Thousand Faces (on a sphere druid: Wild Heart and A Thousand Faces).</p><p><em>Source:
      The Warden.</em> <a href="http://spheresofpower.wikidot.com/avatar#toc8">Full
      text</a></p>'
