  description:
    instructions: ""
    unidentified: ""
    value: '<p>On taking this hex, pick one basic (totem) talent from the War sphere
      (Totem of War allowed) that costs no spell point.</p><p>Grants that totem''s
      effect to one willing creature within 30 ft. for 2 rounds, using her witch level
      as War sphere caster level. Duration +1 round at 5th level and every 5 levels
      after. Once per round as a free action, the target may pass the effect to another
      willing creature within 30 ft. for the rest of the duration; those secondary
      creatures can''t pass it on. When it ends, everyone affected loses the bonus.</p><p>Cackle
      and other effects that interact with the fortune hex also work on this hex.
      A creature can hold only one contagious fervor; targeting it again ends the
      earlier one for it and everyone it spread to.</p><p><strong>Special:</strong>
      with the War sphere, she counts as having the chosen (totem) talent for all
      purposes, but it doesn''t let her make totems if a drawback forbids them. If
      Totem of War was the choice, she instead counts as having any one other (totem)
      talent of her choice.</p><p><em>Source: Blood and Portents (wiki tag [BaP]).</em>
      <a href="http://spheresofpower.wikidot.com/witch-hexes#toc2">Full text</a></p>'
