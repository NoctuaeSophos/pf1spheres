    unidentified: ''
    value: '<p>As the Paizo exploit: a number of times per day equal to her Charisma
      modifier (minimum 1), as a move action that provokes, she drains a potion, scroll,
      wand or staff into her arcane reservoir (½ the contained spell''s level; potions
      and scrolls destroyed; wands lose 5 charges; staves lose 1 charge for points
      equal to the highest 1-charge spell, once per day). Other item types are unaffected.</p><p><strong>Sphere
      change:</strong> an item made with the Spheres of Power system gives points
      equal to ¼ of its caster level. A spell engine is drained the way an implement
      would be.</p><p><em>Source: Ultimate Spheres of Power.</em> <a href="http://spheresofpower.wikidot.com/sphere-arcanist#toc7">Full
