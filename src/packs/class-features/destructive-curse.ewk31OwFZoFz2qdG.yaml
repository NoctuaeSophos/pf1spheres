    instructions: ""
    unidentified: ""
    value: '<p>On taking this hex, pick one basic (blast type) talent from the Destruction
      sphere that costs no spell point.</p><p>Curses one creature within 30 ft. (Will
      negates). On a failed save it takes 1 damage per witch level, of the blast type''s
      damage type, plus that blast type''s extra effects. The curse lasts for rounds
      equal to her casting ability modifier, repeating the damage and effects at the
      end of each of the creature''s turns unless it succeeds on a Will save, which
      ends the curse. Either way, the creature can''t be targeted by this hex again
      for 1 day. Curse effect.</p><p><strong>Special:</strong> with the Destruction
      sphere she counts as having the chosen (blast type) talent for all purposes.
      If she has or later takes the Energy Focus drawback, the chosen blast type must
      be re-picked from that drawback''s group if it falls outside it.</p><p><em>Source:
      Blood and Portents (wiki tag [BaP]).</em> <a href="http://spheresofpower.wikidot.com/witch-hexes#toc5">Full
      text</a></p>'
