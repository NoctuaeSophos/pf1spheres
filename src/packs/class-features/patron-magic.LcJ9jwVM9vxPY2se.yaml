  description:
    instructions: ""
    unidentified: ""
    value: '<p>At 1st level the sphere witch picks a patron, as the Paizo witch. She
      gets no patron spells; instead she gains a bonus magic talent from her patron''s
      sphere at 1st level and at every odd level after (10 bonus talents by 19th).</p><p><strong>Patrons
      grouped by sphere:</strong> Alteration: Strength, Transformation; Creation:
      Mountain; Dark: Moon; Death: Death, Occult, Plague, Rot, Spirits; Destruction:
      Elements; Divination: Ancestors, Portents, Stars; Enhancement: Agility, Devotion;
      Fate: Fate, Jynx, Vengeance, Wisdom; Illusion: Deception, Shadow, Trickery;
      Life: Healing, Mercy, Recovery; Light: Aurora, Light; Mind: Conspiracies, Decadence,
      Enchantment, Entropy, Insanity, Mind, Nightmares; Nature: Animals, Autumn, Plant,
      Summer, Thorns, Water, Winter, Woodlands; Protection: Boundaries, Endurance,
      Peace, Protection; Technomancy: Machine; Time: Time; War: Revenge; Warp: Dimensions,
      Ethereal, Space; Weather: Spring, Storms.</p><p><strong>Replaces:</strong> Patron
      Spells.</p><p><em>Source: Ultimate Spheres of Power.</em> <a href="http://spheresofpower.wikidot.com/sphere-witch#toc4">Full
      text</a></p>'
