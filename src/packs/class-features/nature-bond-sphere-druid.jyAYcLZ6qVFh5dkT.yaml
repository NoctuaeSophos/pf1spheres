  description:
    instructions: ""
    unidentified: ""
    value: '<p>At 1st level, picks one form of bond with nature.</p><p><strong>Domain:</strong>
      one of Air, Animal, Earth, Fire, Plant, Water or Weather (or a druid animal
      or terrain domain, below). She uses druid level as cleric level for the domain''s
      powers. Like a sphere cleric, she gains the domain''s associated sphere, and
      at levels 5, 9, 13 and 17 a bonus talent in it.</p><p><strong>Animal companion:</strong>
      as the Paizo druid; companion advances with druid level, and druid levels from
      multiple sources stack for it. Replacing a companion takes a 24-hour ceremony
      in its home environment.</p><p><strong>Warden''s Bond:</strong> an alternative
      bond (see the Warden''s Bond item).</p><p><strong>Animal domains</strong> have
      Alteration as an associated sphere plus one other; <strong>terrain domains</strong>
      have Nature plus one other, limited to the listed package or descriptor: Aquatic
      (Nature (water) / Weather (precipitation)); Arctic (Nature (water) / Weather
      (cold)); Badlands (Nature (air) / Weather (aridity)); Cave (Nature (earth) /
      Dark); Crocodile (Alteration / War); Desert (Nature (earth) / Weather (heat));
      Eagle (Alteration / Light); Erosion (Creation / Nature (metal)); Frog (Alteration
      / Fallen Fey); Jungle (Life / Nature (plant)); Monkey (Alteration / Enhancement);
      Mountain (Nature (earth) / Protection); Panther (Alteration / Dark); Plains
      (Nature (air) / Weather (wind)); Plane of Air (Destruction (air) / Nature (air));
      Plane of Earth (Destruction (stone) / Nature (earth)); Plane of Fire (Destruction
      (fire) / Nature (fire)); Plane of Water (Destruction (cold) / Nature (water));
      Ruins (Nature (metal) / Time); Serpent (Alteration / Mind); Swamp (Blood / Nature
      (water)); The Shadewood (both Blood and Death); Vermin (Alteration / Illusion);
      Vulture (Alteration / Death); Wolf (Alteration / Conjuration).</p><p>A domain
      tied to a package or descriptor can only grant talents of that package or descriptor,
      or general talents with no package or descriptor tag.</p><p><strong>Replaces:</strong>
      Nature Bond (alters).</p><p><em>Source: Ultimate Spheres of Power.</em> <a href="http://spheresofpower.wikidot.com/sphere-druid#toc4">Full
      text</a></p>'
