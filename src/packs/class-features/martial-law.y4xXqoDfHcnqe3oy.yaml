  description:
    instructions: ''
    unidentified: ''
    value: '<p>An enemy that violates one of her wards provokes an attack of opportunity
      from her. If her patrol is active, she can answer that attack of opportunity
      as though it happened inside her threatened area.</p><p><strong>Entry wards</strong>
      (barrier, Exclusion, Logic, Repel): violated when a creature the ward should
      keep out manages to enter it under its own power.</p><p><strong>Action-gating
      wards</strong> (Clarity, Impedance, Peacebound, Quantum Lock, Spell Ward): violated
      when a creature attempts the action that calls for the Will save or magic skill
      check.</p><p><strong>Attack-reducing wards</strong> (penalty, damage resistance
      or immunity against an attack type; e.g. Energy Resistance, Impartiality, Magnetic
      Shield, Missile Shield): violated whenever a successful attack of that type
      is made, or a creature has to save against it (or would have to if not immune).</p><p>Any
      attempt to destroy or dispel the ward also violates it. Creatures immune to
      the ward can''t violate it.</p><p><em>Source: Ultimate Spheres of Power.</em>
      <a href="http://spheresofpower.wikidot.com/marshal-controller#toc4">Full text</a></p>'
