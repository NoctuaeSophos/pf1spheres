  description:
    instructions: ''
    unidentified: ''
    value: '<p><strong>Prerequisites:</strong> Amateur Arcanist.</p><p>Gain one of
      Brew Potion, Craft Rod, Craft Staff, Craft Wand, Craft Wondrous Item, or Forge
      Ring. Your scholar level counts as your caster level for it, but you must meet
      every other prerequisite (so Craft Rod is unavailable before 9th level).</p><p>You
      also gain a bonus equal to half your scholar level on skill checks made as part
      of crafting. For potions, spell-trigger, and spell-completion items, you can
      skip a spell prerequisite by adding 3 + the spell''s level (or 3 + half the
      caster level of a sphere effect) to the crafting DC. Your scholar level counts
      as caster level for the effects of items you craft yourself.</p><p>You can take
      this knack more than once; each extra selection grants only another feat from
      the list.</p><p><em>Source: Scholar wiki page [CS].</em> <a href="http://spheresofpower.wikidot.com/scholar#toc18">Full
      text</a></p>'
