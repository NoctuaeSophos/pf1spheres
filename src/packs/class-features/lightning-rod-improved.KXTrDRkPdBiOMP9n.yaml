    value: '<p><strong>Prerequisites:</strong> Lightning Rod.</p><p><strong>Temperature:</strong>
      As a standard action while carrying or wielding your lightning rod, raise or
      lower the temperature within 30 ft. of you by up to 5&deg;F per scholar level.
      You and allies in the area gain fire resistance (if you warmed it) or cold resistance
      (if you cooled it) equal to your scholar level, and anyone granted that resistance
      is immune to nonlethal damage from extreme temperatures.</p><p><strong>Weather:</strong>
      By focusing solely on the staff for 1 minute, you can change the weather in
      a 1-mile radius around you to conditions suited to the climate and season, or
      calm it to seasonal norms. Options by season: spring (tornado, thunderstorm,
      sleet storm, hot weather); summer (torrential rain, heat wave, hailstorm); autumn
      (hot or cold weather, fog, sleet); winter (frigid cold, blizzard, thaw); late
      winter (hurricane-force winds, early spring). You control broad tendencies such
      as wind direction and strength, not specifics like where lightning strikes or
      a tornado''s path. The weather holds for up to 1 hour or until you choose a
      new type, which takes 10 minutes to fully arrive. Contradictory conditions cannot
      exist at once.</p><p><em>Source: Spheres of Might.</em> <a href="http://spheresofpower.wikidot.com/scholar#toc26">Full
      text</a></p>'
