  description:
    instructions: ''
    unidentified: ''
    value: '<p>Keeps the Paizo arcanist''s reservoir: it holds at most 3 + arcanist
      level points. Each day when she regains spell points it resets to 3 + ½ arcanist
      level (leftover points are lost); consume spells and some exploits add more,
      but never above the maximum.</p><p><strong>Sphere change:</strong> as with spells,
      when she creates a sphere effect she may spend 1 point as a free action to raise
      its caster level by 1 or its DC by 1 (no more than 1 point per effect).</p><p><em>Source:
      Ultimate Spheres of Power.</em> <a href="http://spheresofpower.wikidot.com/sphere-arcanist#toc2">Full
