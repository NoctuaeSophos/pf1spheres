    unidentified: ''
    value: '<p><strong>Prerequisites:</strong> Animal Training, Small.</p><p>Gain
      Evolved Familiar and Improved Familiar as bonus feats, ignoring their prerequisites.
      Your scholar level counts as your arcane caster level for which improved familiars
      you may choose.</p><p>If you also have Animal Training, Large, your improved
      familiar can gain an animal companion''s level-based advancement (bonus HD,
      feats, Str and Dex increases, skill points, tricks, and so on), using your effective
      druid level minus the base form''s CR. This advancement always follows the animal
      companion base statistics table, whatever the familiar''s type.</p><p><em>Source:
      Spheres of Might.</em> <a href="http://spheresofpower.wikidot.com/scholar#toc23">Full
      text</a></p>'
