    value: '<p>Weapons: club, dagger, dart, quarterstaff, scimitar, scythe, sickle,
      shortspear, sling, spear, plus the natural attacks of any form she assumes.</p><p>Armor:
      light and medium, but no metal armor (padded, leather, hide, or ironwood-treated
      wood). Shields: any but tower shields, and only wooden ones.</p><p>Wearing prohibited
      armor or a prohibited shield shuts off her druid supernatural and spell-like
      class abilities while worn and for 24 hours afterward.</p><p><em>Source: Pathfinder
      RPG Core Rulebook pg. 48.</em> <a href="https://www.aonprd.com/ClassDisplay.aspx?ItemName=Druid">Full
