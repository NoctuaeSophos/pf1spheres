    value:
      '<p>From 3rd level, when you prepare an alchemical item you can make a Heal check (you may
      take 10 but not 20) and expend one healer''s kit use, as with the hit point option of medical training.
      When the item is used, you and inoculated allies in its area regain hit points as if you had treated
      them with medical training using that Heal result. Creatures the item would normally damage take
      half damage (minimum 1) and gain a +2 bonus on saves against its effects.</p><p>Single-target items
      such as Alchemy sphere salves can also be modified this way. Each instance of this healing counts
      against the creature''s daily limit for your medical training.</p><p><strong>Replaces:</strong>
      Material imposition gained at 3rd level.</p><p><em>Source: Doctor (scholar archetype) wiki page.</em>
      <a href="http://spheresofpower.wikidot.com/doctor#toc2">Full text</a></p>'
