  description:
    instructions: ''
    unidentified: ''
    value: '<p>You get a masterwork quarterstaff fitted with alchemical and mechanical
      gear for storing and redirecting electricity; it can be enchanted like any quarterstaff.
      If it is broken or destroyed, you cannot use this knack or Lightning Rod, Improved
      until you spend 8 hours converting another quarterstaff of at least masterwork
      quality.</p><p><strong>Ground:</strong> As an immediate action when an attack
      would deal electricity damage to you, negate up to 5 &times; your scholar level
      of that electricity damage.</p><p><strong>Storm:</strong> As a full-round action
      while wielding the staff, call a lightning bolt on one enemy within 60 ft. for
      1d6 electricity damage per scholar level (Reflex half, DC 10 + half your scholar
      level + your Int modifier). On later rounds you can maintain the storm as a
      standard action to call a new bolt each time.</p><p><em>Source: Spheres of Might.</em>
      <a href="http://spheresofpower.wikidot.com/scholar#toc25">Full text</a></p>'
