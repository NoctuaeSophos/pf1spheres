  description:
    instructions: ""
    unidentified: ""
    value: '<p>You can build a collapsible glider in 1 hour. It has hit points equal
      to your scholar level, hardness equal to twice your Int bonus (minimum 2), and
      weighs 10 lb. Attaching it to yourself or an ally is a standard action; a creature
      can wear only one.</p><p>A wearer can make a DC 15 Fly check to fall any distance
      without falling damage, and during such a fall a second DC 15 Fly check to glide
      5 ft. sideways per 10 ft. dropped. An ally''s glider gives one use lasting up
      to 1 + your Int modifier rounds, then breaks. You can use your own this way
      a number of times per day equal to your Int bonus (minimum 1), each for the
      same duration. Going past either limit makes the attempt fail and breaks the
      glider; a new one takes another hour to build.</p><p><strong>6th level:</strong>
      The glider grants you and equipped allies a fly speed of 30 ft. (average maneuverability),
      and one use lasts 1 + your Int bonus minutes. Besides safe falls, you can fly
      with it 1 + your Int bonus times per day; exceeding that, or staying aloft past
      the duration, fails and breaks it. Allies'' gliders still break after one use.</p><p><strong>10th
      level:</strong> Fly speed becomes 60 ft. (good maneuverability), and one use
      can last up to half your scholar level in hours (rounded down).</p><p><em>Source:
      Spheres of Might.</em> <a href="http://spheresofpower.wikidot.com/scholar#toc8">Full
      text</a></p>'
