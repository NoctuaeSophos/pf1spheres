  description:
    instructions: ''
    unidentified: ''
    value: '<p>From 2nd level, can fill a target with negative energy by touch, a
      number of times per day equal to ½ her soul weaver level + casting ability modifier.</p><p>Standard
      action that doesn''t provoke (swift action on herself). Unwilling targets need
      a melee touch attack. Deals 1d6 damage per 2 soul weaver levels, or heals undead
      by the same amount.</p><p>Counts as lay on hands for any feat, spell or effect
      that specifically works with it (e.g. Extra Lay On Hands adds 2 uses). She may
      spend a feat to gain one antipaladin cruelty, using her soul weaver level as
      antipaladin level.</p><p>Spending 2 uses lets her channel negative energy as
      a cleric, with soul weaver level as cleric level. Channel DC is based on her
      casting ability.</p><p><strong>Replaces:</strong> Blessing/Blight.</p><p><em>Source:
      Ultimate Spheres of Power.</em> <a href="http://spheresofpower.wikidot.com/lichling#toc1">Full
      text</a></p>'
