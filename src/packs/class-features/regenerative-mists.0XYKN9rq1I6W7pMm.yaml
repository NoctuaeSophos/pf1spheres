  description:
    instructions: ""
    unidentified: ""
    value:
      '<p>From 7th level, when you throw a flashbang you can expend your martial focus and one healer''s
      kit use to fill a 30-ft.-radius sphere centered on the target with clear mist. It lasts a number
      of rounds equal to your Int modifier; it cannot pass through solid walls or floors but can spread
      through open windows and very porous surfaces.</p><p>You and creatures protected by your inoculations
      gain fast healing equal to half your scholar level (rounded down) on each turn they begin inside
      the mist. If you begin and end your turn in it, you can regain your martial focus as an immediate
      action any time before your next turn starts.</p><p><strong>Replaces:</strong> Material imposition
      gained at 7th level.</p><p><em>Source: Doctor (scholar archetype) wiki page.</em> <a href="http://spheresofpower.wikidot.com/doctor#toc3">Full
      text</a></p>'
