  description:
    instructions: ''
    unidentified: ''
    value: '<p>You build a small timepiece that works much like a holy symbol. While
      you possess it you have the Time sphere, a spell pool of 1 + your Int modifier
      (minimum 1), Intelligence as your casting ability modifier, and a Time sphere
      caster level equal to half your scholar level (stacks with caster levels from
      other sources).</p><p>If this is the first magic talent you have gained from
      any source, it counts as the casting class feature and grants the usual two
      bonus talents, which must go to Time sphere talents.</p><p>You lose all of this
      while you lack the timepiece. A lost or stolen one can be rebuilt during an
      8-hour rest. It works only for you.</p><p><em>Source: Scholar wiki page [CS].</em>
      <a href="http://spheresofpower.wikidot.com/scholar#toc15">Full text</a></p>'
