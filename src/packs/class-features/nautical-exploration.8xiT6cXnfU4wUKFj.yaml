  description:
    instructions: ""
    unidentified: ""
    value: '<p>You can build a collapsible underwater craft; assembling or taking
      it apart takes 1 hour. It has hit points equal to your scholar level, hardness
      equal to twice your Int bonus (minimum 2), and weighs 40 lb. It carries up to
      2 + your Int bonus Medium creatures (a Small creature counts as half, a Large
      one as two) at a swim speed of 60 ft., with air for a full load for 1 hour per
      scholar level. Opening or sealing it is a move action.</p><p><strong>7th level:</strong>
      You can treat the craft so it works safely in almost any liquid, including acid
      or lava; occupants are protected from that substance while inside.</p><p>Only
      you can pilot it reliably. Anyone else must make a DC 15 Intelligence or Profession
      (sailor) check each round or the craft sinks 10 ft. (or to the nearest surface
      that can hold it, if closer) instead of moving as intended, and it takes 1 damage
      for each round someone else pilots it.</p><p><em>Source: Spheres of Might.</em>
      <a href="http://spheresofpower.wikidot.com/scholar#toc29">Full text</a></p>'
