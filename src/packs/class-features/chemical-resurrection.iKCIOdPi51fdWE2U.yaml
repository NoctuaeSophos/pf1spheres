  description:
    instructions: ''
    unidentified: ''
    value: '<p>At 17th level you can bring a dead creature back to life no matter
      how long it has been dead. The remains need not be whole but must be a substantial
      part of the body (a skeleton, torso, or head; not a finger or toe). The process
      takes 10 minutes and 25,000 gp of chemical components. The creature returns
      at full hit points and health, with no negative levels or Constitution loss,
      and with whatever prepared spells, spell points, or similar resources it had
      when it died.</p><p>It works on creatures killed by death effects, creatures
      turned undead and then destroyed, elementals, and outsiders, but not on constructs,
      undead, or creatures already returned to life by other means. If the soul is
      unwilling or unable to return, the body is restored only as an intact corpse.</p><p><strong>Replaces:</strong>
      Material imposition gained at 17th level.</p><p><em>Source: Doctor (scholar
      archetype) wiki page.</em> <a href="http://spheresofpower.wikidot.com/doctor#toc4">Full
      text</a></p>'
