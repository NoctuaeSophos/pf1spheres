  description:
    instructions: ""
    unidentified: ""
    value: '<p><strong>Prerequisites:</strong> Light sphere.</p><p>While she has at
      least 1 point in her arcane reservoir, she can make herself glow, or suppress
      or restart glows she placed on herself, as a free action (once per round). Making
      such a glow shed bright light takes a separate standard action.</p><p>As a move
      action, she spends 1 point to move one of her glows within her Light sphere
      range off its current creature or object and onto another target in range, which
      keeps the remaining duration and (light) talents. An unwilling target may make
      a Will save to refuse it, in which case the glow stays put. Glows from Dancing
      Lights can''t be moved onto creatures or objects.</p><p><em>Source: Blood and
      Portents (wiki tag [BaP]).</em> <a href="http://spheresofpower.wikidot.com/sphere-arcanist#toc19">Full
      text</a></p>'
