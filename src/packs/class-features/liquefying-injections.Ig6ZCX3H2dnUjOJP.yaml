  description:
    instructions: ''
    unidentified: ''
    value: '<p><strong>Prerequisites:</strong> Scholar level 6th.</p><p>You can deliver
      one poison you have prepared, or one you know an Alchemy talent for, with a
      melee touch attack; it counts as a contact poison whatever its normal type.
      A target that fails its save also begins to liquefy, with effects escalating
      per failed save against poisons delivered this way.</p><p><strong>First failure:</strong>
      -5 to natural armor (minimum 0) for 24 hours. <strong>Second:</strong> 5 Strength
      damage and 5 Dexterity damage. <strong>Third:</strong> permanent transformation
      into an ochre jelly, taking its alignment, special abilities, and Int, Wis,
      and Cha scores and losing all class, racial, and other level-based abilities.</p><p>Applications
      over the same day stack. Anything that cures the original poison removes every
      effect except the final transformation. A transformed creature regains its form
      when it dies; otherwise only miracle, wish, or similar magic restores it. This
      is a polymorph effect.</p><p><em>Source: Spheres of Might.</em> <a href="http://spheresofpower.wikidot.com/scholar#toc27">Full
      text</a></p>'
