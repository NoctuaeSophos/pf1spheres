  description:
    instructions: ''
    unidentified: ''
    value: '<p>At 1st level, bonds with a familiar using the wizard familiar rules,
      with sphere witch level as effective wizard level. She may choose any wizard
      familiar or the witch-specific ones. Familiar levels from other classes stack,
      but the familiar always follows the witch rules.</p><p>From 3rd level the familiar
      can deliver her touch-range hexes (she need not be touching it when she uses
      the hex).</p><p>A lost or dead familiar can be replaced after 1 day with an
      8-hour ritual costing 500 gp per witch level.</p><p><em>Source: Advanced Player''s
      Guide pg. 65.</em> <a href="https://www.aonprd.com/ClassDisplay.aspx?ItemName=Witch">Full
      text</a></p>'
